<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D&D Club — JCCA</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;900&family=Cinzel+Decorative:wght@400;700&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0a08;--red:#c41e1e;--gold:#c8952a;--text:#e0d8c8;--text-m:#a89880;}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  background:var(--bg);
  background-image:
    radial-gradient(ellipse 80% 60% at 50% -10%,#1f0a08,transparent 65%),
    radial-gradient(ellipse 50% 50% at 10% 110%,#180808,transparent 55%);
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  justify-content:center;font-family:'Crimson Pro',Georgia,serif;color:var(--text);
  overflow:hidden;
}
#sparks{position:fixed;inset:0;pointer-events:none;z-index:0;}
.spark{position:absolute;border-radius:50%;animation:tw var(--d,4s) var(--dl,0s) infinite alternate ease-in-out;}
@keyframes tw{from{opacity:.04;}to{opacity:.65;}}
.hero{position:relative;z-index:1;text-align:center;padding:2rem 1.5rem;max-width:520px;}
.ornament{
  font-family:'Cinzel',serif;font-size:.7rem;letter-spacing:.7em;
  color:rgba(200,149,42,.8);margin-bottom:1.2rem;text-shadow:0 0 10px rgba(200,149,42,.25);
  animation:rise .9s ease both;
}
.title{
  font-family:'Cinzel Decorative','Cinzel',serif;
  font-size:clamp(2rem,8vw,4rem);font-weight:700;
  color:var(--text);line-height:1.1;margin-bottom:.4rem;
  animation:rise .8s ease .1s both;
}
.title span{color:var(--red);}
.subtitle{
  font-size:1.05rem;font-style:italic;color:var(--text-m);
  margin-bottom:2.5rem;animation:rise .8s ease .2s both;
}
.divider{
  display:flex;align-items:center;gap:.8rem;margin:0 auto 2.5rem;max-width:260px;
  animation:rise .8s ease .25s both;
}
.divider-line{flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(196,30,30,.4),transparent);}
.divider-gem{color:rgba(196,30,30,.5);font-size:.7rem;letter-spacing:.2em;font-family:'Cinzel',serif;}
.enter-btn{
  display:inline-block;font-family:'Cinzel',serif;font-size:.85rem;font-weight:700;
  letter-spacing:.14em;padding:.85rem 2.8rem;border-radius:4px;cursor:pointer;
  background:rgba(196,30,30,.18);border:2px solid rgba(196,30,30,.6);
  color:var(--text);text-decoration:none;
  transition:all .22s;animation:rise .8s ease .35s both;
  box-shadow:0 0 30px rgba(196,30,30,.08);
}
.enter-btn:hover{
  background:rgba(196,30,30,.32);border-color:var(--red);
  box-shadow:0 0 40px rgba(196,30,30,.2);transform:translateY(-1px);
}
.enter-btn:active{transform:translateY(0);}
@keyframes rise{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}
.footer-text{
  position:fixed;bottom:1.5rem;font-family:'Cinzel',serif;
  font-size:.55rem;letter-spacing:.3em;color:rgba(196,30,30,.2);z-index:1;
}
</style>
</head>
<body>
<div id="sparks"></div>
<div class="hero">
  <div class="ornament">&#9878; &nbsp;&nbsp; D&amp;D CLUB &nbsp;&nbsp; &#9878;</div>
  <div class="title">Dungeon<br><span>&amp;</span> Dragons</div>
  <div class="subtitle">JCCA — Adventurers League</div>
  <div class="divider">
    <div class="divider-line"></div>
    <div class="divider-gem">&#9670;</div>
    <div class="divider-line"></div>
  </div>
  <a href="adventurers_hub.html" class="enter-btn">Enter the Realm</a>
</div>
<div class="footer-text">JCCA &nbsp;&#183;&nbsp; D&amp;D CLUB</div>
<script>
// Ember sparks
const sp = document.getElementById('sparks');
const COLS = ['#c84040','#c8952a','#f0e8d8','#a83020'];
for (let i = 0; i < 55; i++) {
  const el = document.createElement('div');
  el.className = 'spark';
  const size = Math.random() * 2.5 + 0.8;
  el.style.cssText = `
    left:${Math.random()*100}%;top:${Math.random()*100}%;
    width:${size}px;height:${size}px;
    background:${COLS[Math.floor(Math.random()*COLS.length)]};
    --d:${(Math.random()*4+2).toFixed(1)}s;
    --dl:${(Math.random()*3).toFixed(1)}s;
    opacity:0;
  `;
  sp.appendChild(el);
}
// If already logged in, skip to hub
const keys = ['dnd_username','admin_username','session_dm_username','dm_username'];
if (keys.some(k => sessionStorage.getItem(k))) {
  window.location.href = 'adventurers_hub.html';
}
</script>
</body>
</html>
