<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Character Manager — D&D Club</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;900&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<script src="nav.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
:root{
  --bg:#0d0a08;--bg-card:#1a1410;--border:rgba(180,110,40,.22);--border-red:rgba(160,28,28,.38);
  --red:#c41e1e;--red-d:#8b1010;--gold:#c8952a;--gold-d:#7a5818;
  --text:#e0d8c8;--text-m:#a89880;--text-d:#6a5840;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);background-image:radial-gradient(ellipse 80% 50% at 50% 0%,#1f0a08,transparent 65%);min-height:100vh;font-family:'Crimson Pro',Georgia,serif;color:var(--text);}

/* ── STARS ── */
#stars{position:fixed;inset:0;pointer-events:none;z-index:0;}
.star{position:absolute;border-radius:50%;animation:tw var(--d,4s) var(--dl,0s) infinite alternate ease-in-out;}
@keyframes tw{from{opacity:.04;}to{opacity:.55;}}

/* ── LOADING ── */
#screen-loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:100;background:var(--bg);}
.spinner{width:32px;height:32px;border:3px solid rgba(200,149,42,.12);border-top-color:rgba(200,149,42,.6);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── APP ── */
#screen-app{display:none;position:relative;z-index:1;min-height:100vh;}
.portal-wrap{max-width:920px;margin:0 auto;padding:1.2rem 1.2rem 4rem;}

/* ── TABS ── */
.p-tabs{display:flex;gap:.3rem;margin-bottom:1.4rem;flex-wrap:wrap;}
.p-tab{font-family:'Cinzel',serif;font-size:.7rem;font-weight:600;letter-spacing:.08em;padding:.38rem .9rem;border-radius:3px 3px 0 0;border:1px solid rgba(180,110,40,.25);border-bottom:none;background:rgba(180,110,40,.06);color:var(--text-m);cursor:pointer;transition:all .18s;}
.p-tab:hover{background:rgba(180,110,40,.12);color:var(--text);}
.p-tab.active{background:rgba(196,30,30,.18);border-color:rgba(196,30,30,.5);color:var(--text);}
.p-tab-border{height:2px;background:rgba(196,30,30,.35);border-radius:2px;margin-bottom:1.4rem;}

/* ── CARD ── */
.p-card{background:var(--bg-card);border:1px solid var(--border);border-radius:5px;padding:1.4rem 1.6rem;margin-bottom:1rem;}
.p-card-title{font-family:'Cinzel',serif;font-size:1rem;font-weight:700;color:var(--text);margin-bottom:1rem;padding-bottom:.55rem;border-bottom:1px solid rgba(180,110,40,.18);}

/* ── CHARACTER LIST ── */
.char-item{display:flex;align-items:center;justify-content:space-between;padding:.75rem .9rem;border:1px solid rgba(180,110,40,.18);border-radius:4px;margin-bottom:.5rem;cursor:pointer;transition:all .18s;background:rgba(180,110,40,.03);}
.char-item:hover{border-color:rgba(180,110,40,.45);background:rgba(180,110,40,.08);}
.char-item.active-char{border-color:rgba(196,30,30,.45);background:rgba(196,30,30,.06);}
.char-item.lvup{animation:lvup-pulse 1.8s ease-in-out infinite;}
@keyframes lvup-pulse{0%,100%{box-shadow:0 0 0 2px var(--gold),0 0 18px rgba(200,149,42,.4);}50%{box-shadow:0 0 0 2px #f0c860,0 0 32px rgba(240,200,96,.6);}}
.char-name{font-family:'Cinzel',serif;font-size:.88rem;font-weight:700;color:var(--text);}
.char-sub{font-size:.78rem;color:var(--text-d);margin-top:.15rem;}
.char-gold{font-family:'Cinzel',serif;font-size:.8rem;font-weight:700;color:var(--gold);}
.active-pip{font-family:'Cinzel',serif;font-size:.6rem;color:var(--red);font-weight:700;margin-top:.18rem;text-align:right;}
.lvup-badge{background:rgba(200,149,42,.22);border:1px solid var(--gold);color:#f0c860;font-family:'Cinzel',serif;font-size:.5rem;letter-spacing:.1em;padding:.06rem .4rem;border-radius:2px;margin-left:.4rem;vertical-align:middle;}
.empty-state{text-align:center;padding:2rem;color:var(--text-d);font-style:italic;font-size:.88rem;}

/* ── BACK BUTTON TO SHEET ── */
.back-row{display:flex;align-items:center;gap:.5rem;margin-bottom:.8rem;flex-wrap:wrap;}

/* ── INLINE SHEET ── */
.sheet-outer{background:#f2e4b8;border:2px solid rgba(120,80,20,.28);border-radius:3px;box-shadow:0 8px 32px rgba(0,0,0,.5);font-family:'Crimson Pro',Georgia,serif;color:#1e1006;}
.sheet-hdr{background:linear-gradient(180deg,rgba(160,110,30,.1),rgba(160,110,30,.04));border-bottom:2px solid rgba(120,80,20,.28);padding:.9rem 1.3rem;}
.sheet-name{font-family:'Cinzel',serif;font-size:1.3rem;font-weight:900;color:#1e1006;margin-bottom:.35rem;}
.sheet-meta{display:flex;flex-wrap:wrap;gap:.3rem 1.2rem;}
.sheet-meta-item{font-family:'Cinzel',serif;font-size:.5rem;letter-spacing:.1em;text-transform:uppercase;color:#8a6040;}
.sheet-meta-val{font-family:'Cinzel',serif;font-size:.8rem;font-weight:600;color:#4a3018;display:block;}
.sheet-body{display:grid;grid-template-columns:160px 1fr 200px;}
.sheet-col{padding:.7rem .6rem;border-right:1px solid rgba(120,80,20,.18);}
.sheet-col:last-child{border-right:none;}
.sh-sec{font-family:'Cinzel',serif;font-size:.52rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:#8a6040;border-bottom:1px solid rgba(120,80,20,.18);padding-bottom:.15rem;margin-bottom:.35rem;}
.ab-grid{display:flex;flex-direction:column;gap:.3rem;}
.ab-cell{text-align:center;border:1.5px solid rgba(120,80,20,.25);border-radius:4px;padding:.28rem .15rem;}
.ab-lbl{font-family:'Cinzel',serif;font-size:.42rem;letter-spacing:.1em;text-transform:uppercase;color:#8a6040;}
.ab-mod{font-family:'Cinzel',serif;font-size:1.1rem;font-weight:900;color:#1e1006;line-height:1;}
.ab-score{font-family:'Cinzel',serif;font-size:.6rem;color:#4a3018;}
.sk-line{display:flex;align-items:center;gap:.25rem;font-size:.7rem;color:#4a3018;line-height:1.6;}
.sk-val{font-family:'Cinzel',serif;font-size:.6rem;font-weight:700;color:#1e1006;min-width:18px;text-align:right;}
.pip{width:9px;height:9px;border-radius:50%;border:1.5px solid #4a3018;flex-shrink:0;}
.pip.f{background:#4a3018;}.pip.e{background:#9b1515;border-color:#9b1515;}
.hp-panel{border:2px solid rgba(120,80,20,.25);border-radius:4px;padding:.5rem .6rem;margin-bottom:.45rem;}
.hp-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.25rem;text-align:center;margin-bottom:.25rem;}
.hp-n{font-family:'Cinzel',serif;font-size:1.2rem;font-weight:900;color:#1e1006;}
.hp-lbl{font-family:'Cinzel',serif;font-size:.42rem;letter-spacing:.09em;text-transform:uppercase;color:#8a6040;}
.hp-bar-t{height:7px;background:rgba(120,80,20,.12);border-radius:4px;overflow:hidden;}
.hp-bar-f{height:100%;border-radius:4px;transition:width .4s,background .4s;}
.cbt-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.28rem;margin-bottom:.45rem;}
.cbt-box{text-align:center;border:1.5px solid rgba(120,80,20,.2);border-radius:3px;padding:.28rem .1rem;}
.cbt-v{font-family:'Cinzel',serif;font-size:.95rem;font-weight:900;color:#1e1006;}
.cbt-l{font-family:'Cinzel',serif;font-size:.42rem;letter-spacing:.09em;text-transform:uppercase;color:#8a6040;}

/* ── BUTTONS ── */
.btn{font-family:'Cinzel',serif;font-size:.7rem;font-weight:600;letter-spacing:.07em;padding:.38rem .9rem;border-radius:3px;cursor:pointer;border:1px solid;transition:all .18s;display:inline-flex;align-items:center;gap:.3rem;}
.btn-red{background:rgba(155,21,21,.18);border-color:var(--red-d);color:var(--text);}
.btn-red:hover{background:rgba(155,21,21,.32);}
.btn-gold{background:rgba(180,110,40,.15);border-color:var(--gold-d);color:var(--gold);}
.btn-gold:hover{background:rgba(180,110,40,.28);}
.btn-ghost{background:transparent;border-color:rgba(180,110,40,.28);color:var(--text-m);}
.btn-ghost:hover{border-color:var(--gold-d);color:var(--gold);}
.btn-sm{padding:.22rem .6rem;font-size:.62rem;}

/* ── FORM ── */
.form-lbl{display:block;font-family:'Cinzel',serif;font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--text-m);margin-bottom:.22rem;}
.form-inp{width:100%;background:rgba(13,8,4,.7);border:1px solid var(--border);border-radius:3px;padding:.5rem .75rem;color:var(--text);font-family:'Crimson Pro',serif;font-size:.9rem;outline:none;transition:border-color .18s;margin-bottom:.7rem;}
.form-inp:focus{border-color:var(--gold-d);}
.form-ta{width:100%;background:rgba(13,8,4,.7);border:1px solid var(--border);border-radius:3px;padding:.5rem .75rem;color:var(--text);font-family:'Crimson Pro',serif;font-size:.9rem;outline:none;resize:none;margin-bottom:.7rem;}
.form-ta:focus{border-color:var(--gold-d);}
.form-err{font-size:.78rem;color:var(--red);margin-bottom:.5rem;display:none;}
.form-ok{font-size:.78rem;color:#6ab840;margin-bottom:.5rem;display:none;}

/* ── INVENTORY ── */
.inv-item{display:flex;align-items:center;justify-content:space-between;padding:.55rem .75rem;border:1px solid rgba(180,110,40,.14);border-radius:3px;margin-bottom:.35rem;background:rgba(180,110,40,.03);}
.inv-name{font-family:'Cinzel',serif;font-size:.76rem;font-weight:700;color:var(--text);}
.inv-sub{font-size:.72rem;color:var(--text-d);margin-top:.1rem;}

/* ── MODAL ── */
.mbg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:400;align-items:center;justify-content:center;padding:1rem;}
.mbg.open{display:flex;}
.mc{background:var(--bg-card);border:1px solid var(--border-red);border-radius:6px;padding:1.7rem;width:100%;max-width:420px;position:relative;max-height:90vh;overflow-y:auto;}
.mc-title{font-family:'Cinzel',serif;font-size:.88rem;color:var(--text);border-bottom:1px solid rgba(180,110,40,.18);padding-bottom:.38rem;margin-bottom:.9rem;}

/* ── TOAST ── */
.toasts{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);z-index:600;display:flex;flex-direction:column;gap:.3rem;align-items:center;}
.toast{background:var(--bg-card);border:1px solid;border-radius:4px;padding:.5rem 1rem;font-size:.8rem;animation:tin .22s ease;white-space:nowrap;}
@keyframes tin{from{opacity:0;transform:translateY(6px);}to{opacity:1;}}
.toast.success{border-color:#3d7018;color:#6ab840;}
.toast.error{border-color:var(--red-d);color:var(--red);}
.toast.info{border-color:var(--gold-d);color:var(--gold);}

/* ── BACK HUB BUTTON ── */
#btn-hub{position:fixed;top:.6rem;right:1rem;z-index:510;display:none;}
</style>
</head>
<body>
<div id="stars"></div>
<div id="main-nav"></div>
<a href="adventurers_hub.html" id="btn-hub" class="btn btn-ghost btn-sm">&#8962; Hub</a>

<div id="screen-loading">
  <div style="text-align:center;">
    <div class="spinner"></div>
    <p style="font-family:'Cinzel',serif;font-size:.65rem;letter-spacing:.12em;color:rgba(200,149,42,.5);margin-top:.8rem;">LOADING</p>
  </div>
</div>

<div id="screen-app">
  <div class="portal-wrap">

    <div class="p-tabs">
      <button class="p-tab active" id="tab-btn-chars" onclick="switchTab('chars',this)">&#9876; Characters</button>
      <button class="p-tab" id="tab-btn-inv" onclick="switchTab('inv',this)">&#127978; Inventory</button>
      <button class="p-tab" id="tab-btn-acct" onclick="switchTab('acct',this)">&#128100; Account</button>
    </div>
    <div class="p-tab-border"></div>

    <!-- CHARACTERS TAB -->
    <div id="tab-chars">
      <!-- List view -->
      <div id="chars-list-view">
        <div class="p-card">
          <div class="p-card-title">Your Characters</div>
          <div id="chars-list"><div class="empty-state">Loading...</div></div>
          <div style="margin-top:1rem;display:flex;gap:.5rem;flex-wrap:wrap;">
            <button class="btn btn-red" onclick="openRequestModal()">+ Request Character</button>
            <button class="btn btn-gold" id="btn-build" style="display:none;" onclick="showBuildWizard()">&#9650; Build Character</button>
            <span id="pending-hint" style="display:none;font-size:.78rem;color:var(--text-d);font-style:italic;align-self:center;">&#9203; Pending approval</span>
          </div>
        </div>
      </div>
      <!-- Sheet view -->
      <div id="chars-sheet-view" style="display:none;">
        <div class="back-row">
          <button class="btn btn-ghost btn-sm" onclick="showListView()">&#8592; Back to Characters</button>
          <button class="btn btn-gold btn-sm" id="btn-lvup" style="display:none;" onclick="doLevelUp()">&#9650; Level Up!</button>
        </div>
        <div id="sheet-root"></div>
      </div>
    </div>

    <!-- INVENTORY TAB -->
    <div id="tab-inv" style="display:none;">
      <div class="p-card">
        <div class="p-card-title">Inventory</div>
        <div id="inv-list"><div class="empty-state">Loading...</div></div>
      </div>
    </div>

    <!-- ACCOUNT TAB -->
    <div id="tab-acct" style="display:none;">
      <div class="p-card">
        <div class="p-card-title">Account Settings</div>
        <p style="font-size:.88rem;color:var(--text-m);margin-bottom:1.2rem;">Signed in as: <strong style="color:var(--text);" id="acct-username"></strong></p>
        <p style="font-family:'Cinzel',serif;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--text-d);margin-bottom:.8rem;">Change Password</p>
        <label class="form-lbl">Current Password</label>
        <input class="form-inp" id="pw-cur" type="password" placeholder="Current password">
        <label class="form-lbl">New Password</label>
        <input class="form-inp" id="pw-new" type="password" placeholder="At least 6 characters">
        <label class="form-lbl">Confirm New Password</label>
        <input class="form-inp" id="pw-con" type="password" placeholder="Repeat new password">
        <div class="form-err" id="pw-err"></div>
        <div class="form-ok" id="pw-ok"></div>
        <button class="btn btn-red" onclick="changePw()">Update Password</button>
      </div>
    </div>

  </div>
</div>

<!-- REQUEST MODAL -->
<div class="mbg" id="modal-req">
  <div class="mc">
    <div class="mc-title">Request New Character</div>
    <p style="font-size:.84rem;color:var(--text-m);margin-bottom:1rem;">Your admin will review and approve. Once approved you can build your character here.</p>
    <label class="form-lbl">Reason (optional)</label>
    <textarea class="form-ta" id="req-reason" rows="3" maxlength="200" placeholder="e.g. I want to try a different class..."></textarea>
    <div class="form-err" id="req-err"></div>
    <div style="display:flex;gap:.4rem;">
      <button class="btn btn-ghost" onclick="closeModal('modal-req')">Cancel</button>
      <button class="btn btn-red" onclick="submitRequest()">Submit Request</button>
    </div>
  </div>
</div>

<!-- BUILD WIZARD PLACEHOLDER (handled inline) -->
<div class="mbg" id="modal-build" style="display:none;">
  <div class="mc" style="max-width:560px;">
    <div class="mc-title" id="wiz-title">Build Your Character</div>
    <div id="wiz-body"></div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script>
// ════════════════════════════════════════════════════
//  FIREBASE
// ════════════════════════════════════════════════════
firebase.initializeApp({
  apiKey:'AIzaSyAWpUnUirhcI3nhW9WF_7aqDInOCvIbsIY',
  authDomain:'jcca-dnd.firebaseapp.com',projectId:'jcca-dnd',
  storageBucket:'jcca-dnd.firebasestorage.app',
  messagingSenderId:'128758977152',
  appId:'1:128758977152:web:f43ef158eedf82614ccc65'
});
const db = firebase.firestore();

// ════════════════════════════════════════════════════
//  AUTH — synchronous check, no async needed for nav
// ════════════════════════════════════════════════════
const AUTH_KEYS = ['dnd_username','admin_username','session_dm_username','dm_username'];
const loggedUser = AUTH_KEYS.map(k=>localStorage.getItem(k)).find(Boolean);
if (!loggedUser) {
  window.location.href = 'adventurers_hub.html';
} else {
  Nav.init('portal');
  document.getElementById('btn-hub').style.display = 'inline-flex';
}

// ════════════════════════════════════════════════════
//  CONSTANTS
// ════════════════════════════════════════════════════
const XP_THRESH = [0,300,900,2700,6500,14000,23000,34000,48000,64000,85000,100000,120000,140000,165000,195000,225000,265000,305000,355000];
const HIT_DIE = {Barbarian:12,Bard:8,Cleric:8,Druid:8,Fighter:10,Monk:8,Paladin:10,Ranger:10,Rogue:8,Sorcerer:6,Warlock:8,Wizard:6};
const SKEYS=['str','dex','con','int','wis','cha'];
const SABRV={str:'STR',dex:'DEX',con:'CON',int:'INT',wis:'WIS',cha:'CHA'};
const SKILL_AB={Acrobatics:'dex','Animal Handling':'wis',Arcana:'int',Athletics:'str',Deception:'cha',History:'int',Insight:'wis',Intimidation:'cha',Investigation:'int',Medicine:'wis',Nature:'int',Perception:'wis',Performance:'cha',Persuasion:'cha',Religion:'int','Sleight of Hand':'dex',Stealth:'dex',Survival:'wis'};
const ALL_SKILLS = Object.keys(SKILL_AB);
const PROF_BY_LV = {1:2,2:2,3:2,4:2,5:3,6:3,7:3,8:3,9:4,10:4,11:4,12:4,13:5,14:5,15:5,16:5,17:6,18:6,19:6,20:6};
function canLevelUp(c){const lv=c.level||1;if(lv>=20)return false;return(c.xp||0)>=(XP_THRESH[lv]||0);}

// ════════════════════════════════════════════════════
//  STATE
// ════════════════════════════════════════════════════
let playerRecord = null;
let allChars = [];
let activeChar = null;
let viewingChar = null;  // the char whose sheet is open
let inventory = [];

// ════════════════════════════════════════════════════
//  BOOT — load data after nav renders
// ════════════════════════════════════════════════════
async function boot() {
  try {
    await firebase.auth().signInAnonymously();
  } catch(e) { /* anon auth failure is non-fatal */ }

  try {
    const userDoc = await db.collection('Users').doc(loggedUser).get();
    if (!userDoc.exists) { window.location.href = 'adventurers_hub.html'; return; }
    playerRecord = {id: userDoc.id, ...userDoc.data()};
    document.getElementById('acct-username').textContent = loggedUser;

    const isAdmin = playerRecord.role === 'admin' || playerRecord.role === 'dm' || playerRecord.role === 'session_dm';
    allChars = await loadChars();

    // Admins skip character requirement
    if (!isAdmin && allChars.length === 0) {
      // Show app but with empty state + build button if approved
      document.getElementById('screen-loading').style.display = 'none';
      document.getElementById('screen-app').style.display = 'block';
      await checkApprovalFlag();
      renderCharList();
      return;
    }

    // Set active character
    const active = allChars.filter(c=>c.status==='Active');
    const savedId = playerRecord.activeCharacterId;
    activeChar = active.find(c=>c.id===savedId) || active[0] || null;

    document.getElementById('screen-loading').style.display = 'none';
    document.getElementById('screen-app').style.display = 'block';
    await checkApprovalFlag();
    renderCharList();
    checkChests();
  } catch(e) {
    console.error(e);
    document.getElementById('screen-loading').innerHTML = '<p style="color:#c41e1e;font-family:Cinzel,serif;font-size:.8rem;padding:2rem;">Connection error. Please refresh.</p>';
  }
}

async function loadChars() {
  const snap = await db.collection('Characters').where('playerId','==',loggedUser).get();
  return snap.docs.map(d=>({id:d.id,...d.data()}));
}

async function checkApprovalFlag() {
  try {
    const u = await db.collection('Users').doc(loggedUser).get();
    const d = u.data();
    if (d.characterApproved) {
      toast('Your character request was approved! Click Build Character to begin.', 'success');
      document.getElementById('btn-build').style.display = 'inline-flex';
      await db.collection('Users').doc(loggedUser).update({characterApproved: false});
    } else {
      const reqSnap = await db.collection('CharacterRequests')
        .where('playerId','==',loggedUser).where('status','==','ApprovedBuild').get();
      if (!reqSnap.empty) document.getElementById('btn-build').style.display = 'inline-flex';
    }
    const pendSnap = await db.collection('CharacterRequests')
      .where('playerId','==',loggedUser).where('status','==','Pending').get();
    if (!pendSnap.empty) document.getElementById('pending-hint').style.display = 'inline';
  } catch(e) {}
}

async function checkChests() {
  try {
    const snap = await db.collection('PendingChests')
      .where('playerId','==',loggedUser).where('claimed','==',false).get();
    if (!snap.empty) toast(`You have ${snap.size} reward chest(s) waiting! Check your inventory.`, 'info');
  } catch(e) {}
}

// ════════════════════════════════════════════════════
//  TAB SWITCHING
// ════════════════════════════════════════════════════
function switchTab(name, btn) {
  ['chars','inv','acct'].forEach(t => {
    document.getElementById('tab-'+t).style.display = t===name ? 'block' : 'none';
    document.getElementById('tab-btn-'+t).classList.toggle('active', t===name);
  });
  if (name === 'inv') loadInventory();
}

// ════════════════════════════════════════════════════
//  CHARACTER LIST
// ════════════════════════════════════════════════════
function renderCharList() {
  const wrap = document.getElementById('chars-list');
  if (!allChars.length) { wrap.innerHTML = '<div class="empty-state">No characters yet. Submit a request below!</div>'; return; }
  wrap.innerHTML = allChars.map(c => {
    const isActive = activeChar && c.id === activeChar.id;
    const lvUp = c.status === 'Active' && canLevelUp(c);
    const lvBadge = lvUp ? '<span class="lvup-badge">&#9650; LEVEL UP</span>' : '';
    return `<div class="char-item${isActive?' active-char':''}${lvUp?' lvup':''}" onclick="openSheet('${c.id}')">
      <div>
        <div class="char-name">${esc(c.characterName||'Unknown')}${lvBadge}</div>
        <div class="char-sub">${esc(c.race||'')} ${esc(c.class||'')} &middot; Lv ${c.level||1} &middot; ${c.xp||0} XP</div>
      </div>
      <div style="text-align:right;">
        <div class="char-gold">${c.gold??0} gp</div>
        ${isActive?'<div class="active-pip">&#9679; ACTIVE</div>':''}
        ${c.status==='Pending'?'<div style="font-size:.7rem;color:var(--gold-d);margin-top:.15rem;">&#9203; Pending</div>':''}
      </div>
    </div>`;
  }).join('');
}

// ════════════════════════════════════════════════════
//  INLINE CHARACTER SHEET
// ════════════════════════════════════════════════════
async function openSheet(charId) {
  const char = allChars.find(c=>c.id===charId);
  if (!char || char.status !== 'Active') return;
  viewingChar = char;
  // Set as active
  activeChar = char;
  await db.collection('Users').doc(loggedUser).update({activeCharacterId: charId}).catch(()=>{});
  document.getElementById('chars-list-view').style.display = 'none';
  document.getElementById('chars-sheet-view').style.display = 'block';
  document.getElementById('btn-lvup').style.display = canLevelUp(char) ? 'inline-flex' : 'none';
  renderSheet(char);
}

function showListView() {
  document.getElementById('chars-list-view').style.display = 'block';
  document.getElementById('chars-sheet-view').style.display = 'none';
  viewingChar = null;
}

function renderSheet(char) {
  const s = char.sheet || {};
  const sc = s.abilityScores || {str:10,dex:10,con:10,int:10,wis:10,cha:10};
  const lv = char.level || 1;
  const pb = PROF_BY_LV[Math.min(20,Math.max(1,lv))];
  const saves = s.savingThrowProficiencies || [];
  const skillP = s.skillProficiencies || [];
  const skillE = s.skillExpertises || [];
  const maxHp = s.maxHp || (HIT_DIE[char.class]||8);
  const curHp = s.hp ?? maxHp;
  const pct = maxHp ? Math.max(0,Math.min(100,Math.round((curHp/maxHp)*100))) : 0;
  function m(x){return Math.floor(((x||10)-10)/2);}
  function ms(x){const v=m(x);return(v>=0?'+':'')+v;}
  let ac=10+m(sc.dex||10);
  if(char.class==='Barbarian')ac=10+m(sc.dex)+m(sc.con||10);
  if(char.class==='Monk')ac=10+m(sc.dex)+m(sc.wis||10);
  const hpCol=pct>75?'#3d7018':pct>50?'#8a9220':pct>25?'#9a5e12':pct>0?'#8b1010':'#1a0808';
  const pperc=10+m(sc.wis||10)+(skillP.includes('Perception')?pb:0)+(skillE.includes('Perception')?pb:0);

  const abHtml = SKEYS.map(k=>`<div class="ab-cell">
    <div class="ab-lbl">${SABRV[k]}</div>
    <div class="ab-mod">${ms(sc[k]||10)}</div>
    <div class="ab-score">${sc[k]||10}</div>
    ${saves.includes(k)?'<div style="width:5px;height:5px;border-radius:50%;background:#9b1515;margin:.06rem auto 0;"></div>':''}
  </div>`).join('');

  const skillHtml = ALL_SKILLS.map(sk=>{
    const ab=SKILL_AB[sk];const exp=skillE.includes(sk);const prf=skillP.includes(sk)||exp;
    const v=m(sc[ab]||10)+(exp?pb*2:prf?pb:0);
    return `<div class="sk-line"><div class="pip${exp?' e':prf?' f':''}"></div><span class="sk-val">${v>=0?'+':''}${v}</span><span>${sk}</span></div>`;
  }).join('');

  document.getElementById('sheet-root').innerHTML = `
  <div class="sheet-outer">
    <div class="sheet-hdr">
      <div class="sheet-name">${esc(char.characterName||'Unknown')}</div>
      <div class="sheet-meta">
        <div class="sheet-meta-item">Class / Level<span class="sheet-meta-val">${esc(char.class||'—')} ${lv}</span></div>
        <div class="sheet-meta-item">Species<span class="sheet-meta-val">${esc(char.race||'—')}</span></div>
        <div class="sheet-meta-item">Background<span class="sheet-meta-val">${esc(char.background||'—')}</span></div>
        <div class="sheet-meta-item">XP<span class="sheet-meta-val">${char.xp||0}</span></div>
        <div class="sheet-meta-item">Gold<span class="sheet-meta-val">${char.gold||0} gp</span></div>
      </div>
    </div>
    <div class="sheet-body">
      <div class="sheet-col">
        <div class="sh-sec">Abilities</div>
        <div class="ab-grid">${abHtml}</div>
        <div style="margin-top:.6rem;padding-top:.5rem;border-top:1px solid rgba(120,80,20,.15);">
          <div class="sh-sec" style="margin-top:.2rem;">Combat</div>
          <div class="cbt-grid">
            <div class="cbt-box"><div class="cbt-v">${ac}</div><div class="cbt-l">AC</div></div>
            <div class="cbt-box"><div class="cbt-v">${ms(sc.dex||10)}</div><div class="cbt-l">Init</div></div>
            <div class="cbt-box"><div class="cbt-v">+${pb}</div><div class="cbt-l">Prof</div></div>
          </div>
        </div>
      </div>
      <div class="sheet-col" style="overflow-y:auto;max-height:500px;">
        <div class="sh-sec">Skills</div>
        ${skillHtml}
        <div style="margin-top:.3rem;font-size:.7rem;color:#8a6040;">Passive Perc: ${pperc}</div>
        <div class="sh-sec" style="margin-top:.6rem;">Saving Throws</div>
        ${SKEYS.map(k=>{const p=saves.includes(k);const v=m(sc[k]||10)+(p?pb:0);return`<div class="sk-line"><div class="pip${p?' f':''}"></div><span class="sk-val">${v>=0?'+':''}${v}</span><span>${SABRV[k]}</span></div>`;}).join('')}
      </div>
      <div class="sheet-col">
        <div class="sh-sec">Hit Points</div>
        <div class="hp-panel">
          <div class="hp-row">
            <div><div class="hp-n">${curHp}</div><div class="hp-lbl">Current</div></div>
            <div><div class="hp-n">${maxHp}</div><div class="hp-lbl">Max</div></div>
            <div><div class="hp-n" style="font-size:1rem;color:#4a3018;">${s.tempHp||0}</div><div class="hp-lbl">Temp</div></div>
          </div>
          <div class="hp-bar-t"><div class="hp-bar-f" style="width:${pct}%;background:${hpCol};"></div></div>
        </div>
        ${s.originFeat?`<div style="margin-top:.4rem;"><div class="sh-sec">Feat</div><div style="font-size:.78rem;color:#4a3018;">${esc(s.originFeat)}</div></div>`:''}
      </div>
    </div>
  </div>`;
}

// ════════════════════════════════════════════════════
//  LEVEL UP
// ════════════════════════════════════════════════════
async function doLevelUp() {
  if (!viewingChar || !canLevelUp(viewingChar)) return;
  const lv = viewingChar.level || 1;
  const newLv = lv + 1;
  const hd = HIT_DIE[viewingChar.class] || 8;
  const conMod = viewingChar.sheet?.abilityScores?.con ? Math.floor((viewingChar.sheet.abilityScores.con-10)/2) : 0;
  const hpInc = Math.ceil(hd/2) + 1 + conMod;
  const newMax = (viewingChar.sheet?.maxHp || hd) + hpInc;
  const newHp  = (viewingChar.sheet?.hp  ?? (viewingChar.sheet?.maxHp||hd)) + hpInc;
  try {
    await db.collection('Characters').doc(viewingChar.id).update({level:newLv,'sheet.maxHp':newMax,'sheet.hp':Math.min(newHp,newMax)});
    viewingChar.level = newLv;
    if (viewingChar.sheet) { viewingChar.sheet.maxHp=newMax; viewingChar.sheet.hp=Math.min(newHp,newMax); }
    const idx = allChars.findIndex(c=>c.id===viewingChar.id);
    if (idx>=0) allChars[idx] = viewingChar;
    toast(`Level up! ${viewingChar.characterName} is now level ${newLv}! HP +${hpInc}`, 'success');
    renderSheet(viewingChar);
    document.getElementById('btn-lvup').style.display = canLevelUp(viewingChar) ? 'inline-flex' : 'none';
    renderCharList();
  } catch(e) { toast('Level up failed.','error'); }
}

  const reason = document.getElementById('req-reason').value.trim();

    document.getElementById('btn-build').style.display = 'none';

async function loadInventory() {
  const wrap = document.getElementById('inv-list');
  wrap.innerHTML = '<div class="empty-state">Loading...</div>';
  if (!activeChar) { wrap.innerHTML = '<div class="empty-state">No active character.</div>'; return; }
  try {
    const snap = await db.collection('Inventory').where('characterId','==',activeChar.id).get();
    inventory = snap.docs.map(d=>({id:d.id,...d.data()}));
    if (!inventory.length) { wrap.innerHTML = '<div class="empty-state">No items in inventory.</div>'; return; }
    wrap.innerHTML = inventory.map(item=>`
      <div class="inv-item">
        <div>
          <div class="inv-name">${esc(item.itemName||'Unknown')}</div>
          <div class="inv-sub">Qty: ${item.quantity||1} &nbsp;&middot;&nbsp; Source: ${esc(item.source||'—')}</div>
        </div>
      </div>`).join('');
  } catch(e) { wrap.innerHTML = '<div class="empty-state">Failed to load inventory.</div>'; }
}

// ════════════════════════════════════════════════════
//  ACCOUNT — CHANGE PASSWORD
// ════════════════════════════════════════════════════
const HASH_ITER = 200000;
async function hashPw(pw) {
  const enc=new TextEncoder();const salt=crypto.getRandomValues(new Uint8Array(16));
  const key=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:HASH_ITER,hash:'SHA-256'},key,256);
  const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf)));
  return b64(salt.buffer)+':'+b64(bits);
}
async function verifyPw(pw,stored) {
  const enc=new TextEncoder();const[saltB64,hashB64]=stored.split(':');
  const fromB64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const salt=fromB64(saltB64);
  const key=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:HASH_ITER,hash:'SHA-256'},key,256);
  return btoa(String.fromCharCode(...new Uint8Array(bits)))===hashB64;
}
async function changePw() {
  const cur=document.getElementById('pw-cur').value;
  const nw=document.getElementById('pw-new').value;
  const cn=document.getElementById('pw-con').value;
  const errEl=document.getElementById('pw-err');const okEl=document.getElementById('pw-ok');
  errEl.style.display='none';okEl.style.display='none';
  if(!cur||!nw||!cn){errEl.textContent='Please fill in all fields.';errEl.style.display='block';return;}
  if(nw.length<6){errEl.textContent='New password must be at least 6 characters.';errEl.style.display='block';return;}
  if(nw!==cn){errEl.textContent='New passwords do not match.';errEl.style.display='block';return;}
  try{
    const userDoc=await db.collection('Users').doc(loggedUser).get();
    const match=await verifyPw(cur,userDoc.data().passwordHash);
    if(!match){errEl.textContent='Incorrect current password.';errEl.style.display='block';return;}
    const newHash=await hashPw(nw);
    await db.collection('Users').doc(loggedUser).update({passwordHash:newHash});
    okEl.textContent='Password updated!';okEl.style.display='block';
    ['pw-cur','pw-new','pw-con'].forEach(id=>document.getElementById(id).value='');
  }catch(e){errEl.textContent='Update failed. Try again.';errEl.style.display='block';}
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function toast(msg,type='info'){const w=document.getElementById('toasts'),el=document.createElement('div');el.className=`toast ${type}`;el.textContent=msg;w.appendChild(el);setTimeout(()=>el.remove(),5000);}
function closeModal(id){document.getElementById(id).classList.remove('open');}
