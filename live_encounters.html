<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Encounters — D&D Club</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;900&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<script src="nav.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg:#0d0a08;--bg-card:#181410;--bg-card2:#201a14;
  --border:rgba(180,110,40,.2);--border-red:rgba(160,28,28,.38);
  --red:#c41e1e;--red-d:#8b1010;--gold:#c8952a;--gold-d:#7a5818;
  --text:#e0d8c8;--text-m:#a89880;--text-d:#6a5840;
  --green:#3d7018;--green-b:#6ab840;
  --hp-full:#3d7018;--hp-inj:#8a9220;--hp-wnd:#9a5e12;--hp-crit:#8b1010;--hp-dead:#1a0808;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);min-height:100vh;font-family:'Crimson Pro',Georgia,serif;color:var(--text);overflow:hidden;}

/* ── ENCOUNTER LAYOUT ─────────────────────────────────────── */
.enc-layout{
  display:grid;
  grid-template-columns:390px 1fr;
  height:calc(100vh - 54px);
  overflow:hidden;
}
@media(max-width:900px){.enc-layout{grid-template-columns:1fr;height:auto;overflow:auto;}}

/* ── LEFT PANEL: character sheet ─────────────────────────── */
.enc-left{
  border-right:2px solid var(--border);
  overflow-y:auto;
  background:linear-gradient(180deg,rgba(240,228,180,.96),rgba(235,220,170,.98));
  position:relative;
}
.enc-left-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:.55rem .9rem;
  background:rgba(120,80,20,.12);
  border-bottom:1px solid rgba(120,80,20,.25);
  position:sticky;top:0;z-index:10;
}
.enc-left-title{font-family:'Cinzel',serif;font-size:.68rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#4a3018;}
.sheet-nav-btn{
  background:rgba(120,80,20,.12);border:1px solid rgba(120,80,20,.3);
  color:#4a3018;font-family:'Cinzel',serif;font-size:.7rem;font-weight:600;
  padding:.25rem .6rem;border-radius:3px;cursor:pointer;transition:all .18s;
}
.sheet-nav-btn:hover{background:rgba(120,80,20,.25);}
.sheet-nav-btn:disabled{opacity:.35;cursor:default;}
.enc-sheet-content{padding:.8rem .7rem 1rem;color:#1e1006;}

/* Compact sheet elements */
.cs-name{font-family:'Cinzel',serif;font-size:1.2rem;font-weight:900;color:#1e1006;margin-bottom:.25rem;}
.cs-meta{display:flex;flex-wrap:wrap;gap:.3rem 1rem;margin-bottom:.7rem;font-size:.78rem;color:#4a3018;}
.cs-meta span{font-family:'Cinzel',serif;font-size:.5rem;letter-spacing:.1em;text-transform:uppercase;color:#8a6040;display:block;}
.cs-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-bottom:.6rem;}
.cs-sec-title{font-family:'Cinzel',serif;font-size:.54rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#8a6040;border-bottom:1px solid rgba(120,80,20,.2);padding-bottom:.18rem;margin-bottom:.4rem;}
.ab-mini{display:grid;grid-template-columns:repeat(6,1fr);gap:.3rem;margin-bottom:.6rem;}
.ab-mini-cell{text-align:center;border:1.5px solid rgba(120,80,20,.25);border-radius:4px;padding:.3rem .15rem;background:rgba(220,185,80,.04);}
.ab-mini-nm{font-family:'Cinzel',serif;font-size:.42rem;letter-spacing:.1em;text-transform:uppercase;color:#8a6040;}
.ab-mini-mod{font-family:'Cinzel',serif;font-size:1rem;font-weight:900;color:#1e1006;line-height:1;}
.ab-mini-sc{font-family:'Cinzel',serif;font-size:.6rem;font-weight:600;color:#4a3018;}
.skill-mini{font-size:.72rem;color:#4a3018;display:flex;align-items:center;gap:.28rem;line-height:1.55;}
.skill-mini .sval{font-family:'Cinzel',serif;font-size:.62rem;font-weight:700;color:#1e1006;min-width:20px;text-align:right;}
.sc-pip{width:9px;height:9px;border-radius:50%;border:1.5px solid #4a3018;flex-shrink:0;}
.sc-pip.f{background:#4a3018;} .sc-pip.e{background:#9b1515;border-color:#9b1515;}
.hp-panel{border:2px solid rgba(120,80,20,.28);border-radius:4px;padding:.55rem .7rem;margin-bottom:.5rem;}
.hp-panel-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.3rem;text-align:center;margin-bottom:.3rem;}
.hp-n{font-family:'Cinzel',serif;font-size:1.3rem;font-weight:900;color:#1e1006;}
.hp-l{font-family:'Cinzel',serif;font-size:.42rem;letter-spacing:.1em;text-transform:uppercase;color:#8a6040;}
.hp-bar-t{height:8px;background:rgba(120,80,20,.12);border-radius:4px;overflow:hidden;border:1px solid rgba(120,80,20,.18);}
.hp-bar-f{height:100%;border-radius:4px;transition:width .4s,background .4s;}
.combat-mini{display:grid;grid-template-columns:repeat(3,1fr);gap:.35rem;margin-bottom:.5rem;}
.cm-box{text-align:center;border:1.5px solid rgba(120,80,20,.22);border-radius:3px;padding:.3rem .1rem;}
.cm-v{font-family:'Cinzel',serif;font-size:1.1rem;font-weight:900;color:#1e1006;}
.cm-l{font-family:'Cinzel',serif;font-size:.42rem;letter-spacing:.1em;text-transform:uppercase;color:#8a6040;}

/* ── RIGHT PANEL ──────────────────────────────────────────── */
.enc-right{
  display:flex;flex-direction:column;overflow:hidden;
  background:var(--bg);
}

/* Section headers */
.enc-section-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:.55rem 1rem;
  border-bottom:1px solid var(--border);
  background:rgba(13,10,8,.6);flex-shrink:0;
}
.enc-section-label{
  font-family:'Cinzel',serif;font-size:.65rem;font-weight:700;
  letter-spacing:.16em;text-transform:uppercase;color:var(--text-d);
  display:flex;align-items:center;gap:.5rem;
}
.section-count{
  font-family:'Cinzel',serif;font-size:.58rem;background:rgba(196,30,30,.15);
  border:1px solid var(--border-red);border-radius:2px;
  padding:.05rem .4rem;color:var(--red);
}

/* Combatant cards container */
.enc-cards-area{
  padding:.8rem 1rem;flex:0 0 auto;
  overflow-x:auto;overflow-y:auto;
}
.enc-cards-grid{display:flex;flex-wrap:wrap;gap:.55rem;}

/* ── COMBATANT CARD ───────────────────────────────────────── */
.cc{
  width:148px;flex-shrink:0;
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:4px;padding:.55rem .6rem;cursor:pointer;
  transition:all .18s;position:relative;
}
.cc:hover{border-color:var(--gold-d);transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,0,0,.4);}
.cc.enemy{border-left:3px solid var(--red-d);}
.cc.player{border-left:3px solid var(--gold-d);}
.cc.dead{opacity:.45;cursor:default;}
.cc-name{font-family:'Cinzel',serif;font-size:.75rem;font-weight:700;color:var(--text);margin-bottom:.18rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cc-sub{font-size:.68rem;color:var(--text-d);margin-bottom:.35rem;}
.cc-hp-row{display:flex;align-items:baseline;gap:.3rem;margin-bottom:.25rem;}
.cc-hp-num{font-family:'Cinzel',serif;font-size:.85rem;font-weight:700;color:var(--text);}
.cc-hp-max{font-size:.65rem;color:var(--text-d);}
.cc-bar-t{height:6px;background:rgba(180,110,40,.08);border-radius:3px;overflow:hidden;margin-bottom:.28rem;}
.cc-bar-f{height:100%;border-radius:3px;transition:width .4s,background .4s;}
.status-badge{
  font-family:'Cinzel',serif;font-size:.52rem;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;padding:.08rem .4rem;border-radius:2px;display:inline-block;
}
.sb-fine{background:rgba(61,112,24,.18);border:1px solid rgba(61,112,24,.4);color:#6ab840;}
.sb-injured{background:rgba(138,146,32,.15);border:1px solid rgba(138,146,32,.35);color:#c8d040;}
.sb-bloodied{background:rgba(154,94,18,.18);border:1px solid rgba(154,94,18,.4);color:#d08040;}
.sb-critical{background:rgba(139,16,16,.2);border:1px solid rgba(139,16,16,.45);color:#e06060;}
.sb-unconscious{background:rgba(60,8,8,.4);border:1px solid rgba(90,8,8,.5);color:#c06060;}
.sb-dead{background:rgba(20,8,8,.7);border:1px solid rgba(30,8,8,.6);color:#705050;}
.cc-conds{font-size:.6rem;color:#e06060;margin-top:.18rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* ── DM NOTES AREA ────────────────────────────────────────── */
.enc-notes-area{
  flex:1 1 0;min-height:120px;overflow:hidden;
  display:flex;flex-direction:column;
  border-top:2px solid var(--border);border-bottom:2px solid var(--border);
}
.enc-notes-body{flex:1;overflow:auto;padding:.8rem 1rem;}
.enc-notes-img{max-width:100%;max-height:160px;object-fit:contain;border-radius:3px;margin-bottom:.6rem;display:block;}
.enc-notes-text{font-size:.88rem;color:var(--text-m);line-height:1.7;white-space:pre-wrap;}
.enc-notes-empty{font-size:.82rem;color:var(--text-d);font-style:italic;}
.dm-notes-form{padding:.7rem 1rem;border-top:1px solid var(--border);background:rgba(13,10,8,.5);flex-shrink:0;}
.dm-notes-input{width:100%;background:rgba(13,8,4,.7);border:1px solid var(--border);border-radius:3px;padding:.45rem .7rem;color:var(--text);font-family:'Crimson Pro',serif;font-size:.85rem;resize:none;outline:none;margin-bottom:.4rem;}
.dm-notes-input:focus{border-color:var(--gold-d);}
.dm-notes-row{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap;}

/* ── PARTY SECTION ────────────────────────────────────────── */
.enc-party-area{padding:.8rem 1rem;flex:0 0 auto;overflow-x:auto;}

/* ── PENDING ACTIONS PANEL (DM) ──────────────────────────── */
.pending-panel{
  position:fixed;bottom:1rem;right:1rem;
  background:var(--bg-card);border:2px solid var(--border-red);
  border-radius:5px;width:320px;max-height:380px;z-index:300;
  display:none;flex-direction:column;
  box-shadow:0 8px 32px rgba(0,0,0,.6);
}
.pending-panel.has-items{display:flex;}
.pp-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:.5rem .8rem;border-bottom:1px solid var(--border-red);
  font-family:'Cinzel',serif;font-size:.7rem;font-weight:700;letter-spacing:.1em;color:var(--red);
}
.pp-body{overflow-y:auto;flex:1;}
.pp-action{
  padding:.65rem .8rem;border-bottom:1px solid rgba(180,110,40,.1);
  font-size:.82rem;color:var(--text-m);
}
.pp-action-title{font-family:'Cinzel',serif;font-size:.72rem;font-weight:600;color:var(--text);margin-bottom:.3rem;}
.pp-action-detail{font-size:.76rem;color:var(--text-m);margin-bottom:.45rem;}
.pp-btn-row{display:flex;gap:.35rem;flex-wrap:wrap;}
.pp-btn{font-family:'Cinzel',serif;font-size:.62rem;font-weight:600;letter-spacing:.06em;padding:.28rem .7rem;border-radius:3px;cursor:pointer;border:1px solid;transition:all .18s;}
.pp-btn-confirm{background:rgba(60,110,30,.2);border-color:rgba(60,110,30,.5);color:#80c060;}
.pp-btn-deny{background:rgba(155,21,21,.15);border-color:var(--red-d);color:var(--red);}
.pp-btn-override{background:rgba(180,110,40,.12);border-color:var(--gold-d);color:var(--gold);}
.pp-override-input{width:70px;background:rgba(13,8,4,.7);border:1px solid var(--border);border-radius:3px;padding:.2rem .4rem;color:var(--text);font-family:'Cinzel',serif;font-size:.75rem;text-align:center;outline:none;}
.pp-badge{
  position:absolute;top:-8px;right:-8px;background:var(--red);
  color:#fff;font-family:'Cinzel',serif;font-size:.6rem;font-weight:700;
  width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;
}

/* ── MODALS ───────────────────────────────────────────────── */
.mbg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:400;align-items:center;justify-content:center;padding:1rem;}
.mbg.open{display:flex;}
.mc{background:var(--bg-card);border:1px solid var(--border-red);border-radius:6px;padding:1.8rem;width:100%;max-width:420px;position:relative;}
.mc-title{font-family:'Cinzel',serif;font-size:.92rem;color:var(--text);border-bottom:1px solid var(--border);padding-bottom:.4rem;margin-bottom:1rem;}
.mc-step{font-size:.82rem;color:var(--text-m);line-height:1.65;}
.mc-stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem;margin:.7rem 0;}
.stat-btn{font-family:'Cinzel',serif;font-size:.65rem;font-weight:700;letter-spacing:.08em;padding:.45rem;border-radius:3px;border:1px solid var(--border);background:rgba(180,110,40,.06);color:var(--text-m);cursor:pointer;transition:all .18s;text-align:center;}
.stat-btn:hover,.stat-btn.selected{background:rgba(180,110,40,.2);border-color:var(--gold-d);color:var(--gold);}
.mc-input{width:100%;background:rgba(13,8,4,.7);border:1px solid var(--border);border-radius:4px;padding:.52rem .8rem;color:var(--text);font-family:'Crimson Pro',serif;font-size:1.2rem;text-align:center;outline:none;margin:.5rem 0;}
.mc-input:focus{border-color:var(--gold-d);}
.mc-btn-row{display:flex;gap:.4rem;margin-top:.7rem;flex-wrap:wrap;}
.mc-btn{flex:1;min-width:100px;font-family:'Cinzel',serif;font-size:.72rem;font-weight:600;letter-spacing:.06em;padding:.48rem;border-radius:3px;cursor:pointer;border:1px solid;transition:all .18s;}
.mc-btn-red{background:rgba(155,21,21,.18);border-color:var(--red-d);color:var(--text);}
.mc-btn-red:hover{background:rgba(155,21,21,.32);}
.mc-btn-gold{background:rgba(180,110,40,.15);border-color:var(--gold-d);color:var(--gold);}
.mc-btn-gold:hover{background:rgba(180,110,40,.28);}
.mc-btn-ghost{background:transparent;border-color:var(--border);color:var(--text-m);}
.mc-btn-ghost:hover{border-color:var(--gold-d);color:var(--gold);}
.mc-btn-green{background:rgba(60,110,30,.2);border-color:rgba(60,110,30,.5);color:#80c060;}
.mc-btn-green:hover{background:rgba(60,110,30,.35);}
.mc-info-box{background:rgba(180,110,40,.06);border:1px solid rgba(180,110,40,.2);border-radius:3px;padding:.65rem .8rem;font-size:.8rem;color:var(--text-m);margin:.5rem 0;line-height:1.65;}
.mc-info-box b{color:var(--gold);font-family:'Cinzel',serif;}
.mc-waiting{text-align:center;padding:1rem;font-style:italic;color:var(--text-d);}
.spinner-sm{width:18px;height:18px;border:2px solid rgba(200,160,50,.12);border-top-color:rgba(200,160,50,.5);border-radius:50%;animation:spin .8s linear infinite;display:inline-block;margin-right:.5rem;vertical-align:middle;}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── ADD ENEMY FORM (DM) ──────────────────────────────────── */
.add-enemy-row{display:flex;gap:.4rem;align-items:flex-end;flex-wrap:wrap;margin-top:.5rem;}
.ae-input{background:rgba(13,8,4,.7);border:1px solid var(--border);border-radius:3px;padding:.35rem .6rem;color:var(--text);font-family:'Crimson Pro',serif;font-size:.85rem;outline:none;}
.ae-input:focus{border-color:var(--gold-d);}
.ae-label{font-family:'Cinzel',serif;font-size:.52rem;letter-spacing:.1em;text-transform:uppercase;color:var(--text-d);display:block;margin-bottom:.18rem;}

/* ── SETUP SCREEN ─────────────────────────────────────────── */
.setup-screen{max-width:640px;margin:2rem auto;padding:0 1rem;}
.setup-card{background:var(--bg-card);border:1px solid var(--border-red);border-radius:5px;padding:2rem;}
.setup-title{font-family:'Cinzel',serif;font-size:1rem;font-weight:700;color:var(--red);margin-bottom:1rem;}
.form-label{display:block;font-family:'Cinzel',serif;font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--text-m);margin-bottom:.22rem;}
.form-input{width:100%;background:rgba(13,8,4,.7);border:1px solid var(--border);border-radius:3px;padding:.5rem .75rem;color:var(--text);font-family:'Crimson Pro',serif;font-size:.9rem;outline:none;margin-bottom:.65rem;}
.form-input:focus{border-color:var(--gold-d);}
.picker-grid{display:grid;grid-template-columns:1fr 1fr;gap:.3rem;max-height:200px;overflow-y:auto;margin-bottom:.8rem;}
.picker-label{display:flex;align-items:center;gap:.4rem;font-size:.82rem;color:var(--text-m);cursor:pointer;padding:.2rem 0;}
.enc-btn{font-family:'Cinzel',serif;font-size:.72rem;font-weight:600;letter-spacing:.07em;padding:.4rem 1rem;border-radius:3px;cursor:pointer;border:1px solid;transition:all .18s;}
.enc-btn-red{background:rgba(155,21,21,.2);border-color:var(--red-d);color:var(--text);}
.enc-btn-red:hover{background:rgba(155,21,21,.36);}
.enc-btn-gold{background:rgba(180,110,40,.15);border-color:var(--gold-d);color:var(--gold);}
.enc-btn-ghost{background:transparent;border-color:var(--border);color:var(--text-m);}
.enc-btn-ghost:hover{border-color:var(--gold-d);color:var(--gold);}
.enc-btn-danger{background:rgba(155,21,21,.1);border-color:rgba(155,21,21,.35);color:var(--red);}
.enc-btn-danger:hover{background:rgba(155,21,21,.25);}
.enc-btn-sm{padding:.22rem .6rem;font-size:.6rem;}
.enc-btn-green{background:rgba(60,110,30,.2);border-color:rgba(60,110,30,.5);color:#80c060;}

/* ── TOASTS ───────────────────────────────────────────────── */
.toasts{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);z-index:600;display:flex;flex-direction:column;gap:.35rem;align-items:center;}
.toast{background:var(--bg-card);border:1px solid;border-radius:4px;padding:.55rem 1.1rem;font-size:.82rem;animation:tin .22s ease;white-space:nowrap;}
@keyframes tin{from{opacity:0;transform:translateY(6px);}to{opacity:1;}}
.toast.success{border-color:#3d7018;color:#80c060;}
.toast.error{border-color:var(--red-d);color:var(--red);}
.toast.info{border-color:var(--gold-d);color:var(--gold);}
.no-session-msg{text-align:center;padding:3rem 1rem;font-style:italic;color:var(--text-d);font-size:.9rem;}
</style>
</head>
<body>
<div id="main-nav"></div>

<!-- ── SETUP SCREEN ────────────────────────────────────────── -->
<div id="screen-setup" style="display:none;">
  <div id="setup-dm" style="display:none;">
    <div class="setup-screen">
      <div class="setup-card">
        <div class="setup-title">&#9876; Start Encounter Session</div>
        <label class="form-label">Session Name</label>
        <input class="form-input" id="ss-name" type="text" placeholder="e.g. The Crypt of Shadows">
        <label class="form-label">Select Party Members</label>
        <div class="picker-grid" id="party-picker"></div>
        <button class="enc-btn enc-btn-red" onclick="startSession()" style="width:100%;">Begin Encounter</button>
      </div>
    </div>
  </div>
  <div id="setup-player" style="display:none;">
    <div class="no-session-msg">&#9889; No active encounter right now.<br>Your DM will start one when the session begins.</div>
  </div>
</div>

<!-- ── ENCOUNTER HUD ───────────────────────────────────────── -->
<div id="screen-enc" style="display:none;" class="enc-layout">

  <!-- LEFT: Character Sheet -->
  <div class="enc-left">
    <div class="enc-left-header">
      <div class="enc-left-title" id="enc-sheet-label">Character Sheet</div>
      <div style="display:flex;gap:.35rem;" id="sheet-nav-wrap">
        <button class="sheet-nav-btn" id="btn-prev-sheet" onclick="navSheet(-1)" disabled>&#8592;</button>
        <button class="sheet-nav-btn" id="btn-next-sheet" onclick="navSheet(1)" disabled>&#8594;</button>
      </div>
    </div>
    <div class="enc-sheet-content" id="enc-sheet-root">
      <div class="no-session-msg">Loading...</div>
    </div>
  </div>

  <!-- RIGHT: HUD panels -->
  <div class="enc-right">

    <!-- HOSTILES -->
    <div class="enc-section-header">
      <div class="enc-section-label">
        &#9761; Hostiles
        <span class="section-count" id="hostile-count">0</span>
      </div>
      <div id="dm-hostile-controls" style="display:none;">
        <div class="add-enemy-row">
          <div><div class="ae-label">Name</div><input class="ae-input" id="e-name" type="text" placeholder="Goblin" style="width:110px;"></div>
          <div><div class="ae-label">Max HP</div><input class="ae-input" id="e-hp" type="number" min="1" max="999" value="12" style="width:65px;"></div>
          <div><div class="ae-label">AC</div><input class="ae-input" id="e-ac" type="number" min="1" max="30" value="12" style="width:55px;"></div>
          <div><div class="ae-label">Init</div><input class="ae-input" id="e-init" type="number" min="-5" max="30" value="0" style="width:50px;"></div>
          <div style="padding-bottom:.02rem;"><div class="ae-label">&nbsp;</div><button class="enc-btn enc-btn-red enc-btn-sm" onclick="addEnemy()">+ Add</button></div>
        </div>
      </div>
    </div>
    <div class="enc-cards-area">
      <div class="enc-cards-grid" id="hostile-cards"></div>
    </div>

    <!-- DM NOTES -->
    <div class="enc-notes-area">
      <div class="enc-section-header">
        <div class="enc-section-label">&#128221; Encounter Notes</div>
        <button class="enc-btn enc-btn-ghost enc-btn-sm" id="btn-edit-notes" style="display:none;" onclick="toggleNotesEdit()">Edit</button>
      </div>
      <div class="enc-notes-body" id="notes-display">
        <div class="enc-notes-empty">No notes posted yet.</div>
      </div>
      <div class="dm-notes-form" id="notes-form" style="display:none;">
        <textarea class="dm-notes-input" id="notes-text" rows="3" placeholder="Describe the scene, room layout, or flavour text..."></textarea>
        <div class="dm-notes-row">
          <input class="ae-input" id="notes-img-url" type="text" placeholder="Paste image URL (optional)" style="flex:1;">
          <button class="enc-btn enc-btn-gold enc-btn-sm" onclick="saveNotes()">Save</button>
          <button class="enc-btn enc-btn-ghost enc-btn-sm" onclick="toggleNotesEdit()">Cancel</button>
        </div>
      </div>
    </div>

    <!-- PARTY -->
    <div class="enc-section-header">
      <div class="enc-section-label">
        &#9876; Party
        <span class="section-count" id="party-count">0</span>
      </div>
      <div id="dm-session-controls" style="display:none;">
        <button class="enc-btn enc-btn-danger enc-btn-sm" onclick="endSession()">End Session</button>
      </div>
    </div>
    <div class="enc-party-area">
      <div class="enc-cards-grid" id="party-cards"></div>
    </div>

  </div>
</div>

<!-- ── PENDING ACTIONS PANEL (DM) ──────────────────────────── -->
<div class="pending-panel" id="pending-panel" style="position:fixed;bottom:1rem;right:1rem;z-index:300;">
  <div class="pp-header">
    &#9888; Pending Actions
    <span id="pending-badge" style="font-family:'Cinzel',serif;font-size:.62rem;background:rgba(155,21,21,.3);border:1px solid var(--red-d);border-radius:2px;padding:.05rem .45rem;color:var(--red);"></span>
  </div>
  <div class="pp-body" id="pending-body"></div>
</div>

<!-- ── ACTION MODAL ────────────────────────────────────────── -->
<div class="mbg" id="m-action">
  <div class="mc">
    <div class="mc-title" id="m-action-title">Combat Action</div>
    <div id="m-action-body"></div>
  </div>
</div>

<!-- ── TOASTS ──────────────────────────────────────────────── -->
<div class="toasts" id="toasts"></div>

<script>
// ══════════════════════════════════════════════════════════
//  FIREBASE
// ══════════════════════════════════════════════════════════
firebase.initializeApp({
  apiKey:'AIzaSyAWpUnUirhcI3nhW9WF_7aqDInOCvIbsIY',
  authDomain:'jcca-dnd.firebaseapp.com', projectId:'jcca-dnd',
  storageBucket:'jcca-dnd.firebasestorage.app',
  messagingSenderId:'128758977152',
  appId:'1:128758977152:web:f43ef158eedf82614ccc65'
});
const auth = firebase.auth(), db = firebase.firestore();

// ══════════════════════════════════════════════════════════
//  CONSTANTS
// ══════════════════════════════════════════════════════════
const SKEYS = ['str','dex','con','int','wis','cha'];
const SNAMES = {str:'Strength',dex:'Dexterity',con:'Constitution',int:'Intelligence',wis:'Wisdom',cha:'Charisma'};
const SABRV  = {str:'STR',dex:'DEX',con:'CON',int:'INT',wis:'WIS',cha:'CHA'};
const SKILL_AB = {Acrobatics:'dex','Animal Handling':'wis',Arcana:'int',Athletics:'str',Deception:'cha',History:'int',Insight:'wis',Intimidation:'cha',Investigation:'int',Medicine:'wis',Nature:'int',Perception:'wis',Performance:'cha',Persuasion:'cha',Religion:'int','Sleight of Hand':'dex',Stealth:'dex',Survival:'wis'};
const ALL_SKILLS = Object.keys(SKILL_AB);
const HIT_DIE = {Barbarian:12,Bard:8,Cleric:8,Druid:8,Fighter:10,Monk:8,Paladin:10,Ranger:10,Rogue:8,Sorcerer:6,Warlock:8,Wizard:6};
const PROF_BY_LV = {1:2,2:2,3:2,4:2,5:3,6:3,7:3,8:3,9:4,10:4,11:4,12:4,13:5,14:5,15:5,16:5,17:6,18:6,19:6,20:6};
// Status labels (player view of enemies + allies)
function statusLabel(pct) {
  if (pct > 75) return ['Unharmed',   'fine'];
  if (pct > 50) return ['Injured',    'injured'];
  if (pct > 25) return ['Bloodied',   'bloodied'];
  if (pct > 0)  return ['Critical',   'critical'];
  return ['Unconscious', 'unconscious'];
}

// ══════════════════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════════════════
let loggedUser=null, loggedRole=null, loggedName=null;
let myChar=null;           // logged-in player's Character doc
let activeSessionId=null, sessionData=null;
let combatants={};         // id → data
let pendingActions={};     // id → data (DM pending action confirmations)
let partyChars=[];         // all party Character docs for DM sheet nav
let sheetNavIdx=0;         // DM sheet nav index
let unsubSession=null, unsubCombatants=null, unsubActions=null;
let myPendingActionId=null; // player's currently pending action
let unsubMyAction=null;

// ══════════════════════════════════════════════════════════
//  BOOT
// ══════════════════════════════════════════════════════════
async function boot() {
  try { await auth.signInAnonymously(); } catch(e) {}
  const keys = ['dnd_username','dm_username','admin_username','session_dm_username'];
  const saved = keys.map(k => sessionStorage.getItem(k)).find(Boolean);
  if (!saved) { window.location.href = 'index.html'; return; }
  try {
    const doc = await db.collection('Users').doc(saved).get();
    if (!doc.exists) { window.location.href = 'index.html'; return; }
    const d = doc.data();
    loggedUser = saved; loggedRole = d.role; loggedName = d.playerName || saved;
    Nav.init('encounters');
    if (loggedRole === 'admin' || loggedRole === 'session_dm' || loggedRole === 'dm') {
      await loadMyChar();
      listenForSession();
    } else {
      await loadMyChar();
      listenForSession();
    }
  } catch(e) { console.error(e); }
}

async function loadMyChar() {
  const snap = await db.collection('Characters')
    .where('playerId','==',loggedUser).where('status','==','Active').get();
  if (!snap.empty) {
    const d = snap.docs[0];
    myChar = {id:d.id,...d.data()};
  }
}

const isDM = () => ['admin','session_dm','dm'].includes(loggedRole);

// ══════════════════════════════════════════════════════════
//  SESSION LISTENER
// ══════════════════════════════════════════════════════════
function listenForSession() {
  if (unsubSession) unsubSession();
  unsubSession = db.collection('ActiveCombat').where('isActive','==',true)
    .onSnapshot(snap => {
      if (snap.empty) {
        noActiveSession();
      } else {
        const doc = snap.docs[0];
        const newId = doc.id;
        if (newId !== activeSessionId) {
          activeSessionId = newId;
          sessionData = doc.data();
          if (unsubCombatants) { unsubCombatants(); unsubCombatants=null; }
          if (unsubActions) { unsubActions(); unsubActions=null; }
          listenCombatants();
          if (isDM()) listenPendingActions();
        } else {
          sessionData = doc.data();
          renderNotes();
        }
        showHUD();
      }
    });
}

function noActiveSession() {
  activeSessionId = null; sessionData = null; combatants = {}; pendingActions = {};
  if (unsubCombatants) { unsubCombatants(); unsubCombatants=null; }
  if (unsubActions) { unsubActions(); unsubActions=null; }
  document.getElementById('screen-setup').style.display = 'block';
  document.getElementById('screen-enc').style.display = 'none';
  document.getElementById('setup-dm').style.display = isDM() ? 'block' : 'none';
  document.getElementById('setup-player').style.display = isDM() ? 'none' : 'block';
  if (isDM()) loadPartyPicker();
}

function showHUD() {
  document.getElementById('screen-setup').style.display = 'none';
  document.getElementById('screen-enc').style.display = 'grid';
  if (isDM()) {
    document.getElementById('dm-hostile-controls').style.display = 'block';
    document.getElementById('dm-session-controls').style.display = 'flex';
    document.getElementById('btn-edit-notes').style.display = 'inline-flex';
    document.getElementById('sheet-nav-wrap').style.display = 'flex';
  }
  renderNotes();
  renderEncSheet();
}

// ══════════════════════════════════════════════════════════
//  COMBATANTS LISTENER
// ══════════════════════════════════════════════════════════
function listenCombatants() {
  if (!activeSessionId) return;
  unsubCombatants = db.collection('ActiveCombat').doc(activeSessionId)
    .collection('combatants').onSnapshot(snap => {
      combatants = {};
      snap.forEach(d => { combatants[d.id] = {id:d.id,...d.data()}; });
      renderCards();
      // Load character sheets for DM nav
      if (isDM()) loadPartyCharsForNav();
    });
}

async function loadPartyCharsForNav() {
  const playerCombatants = Object.values(combatants).filter(c=>c.type==='player'&&c.characterId);
  const charIds = playerCombatants.map(c=>c.characterId);
  if (!charIds.length) { partyChars=[]; return; }
  const snaps = await Promise.all(charIds.map(id=>db.collection('Characters').doc(id).get()));
  partyChars = snaps.filter(d=>d.exists).map(d=>({id:d.id,...d.data()}));
  updateSheetNav();
}

// ══════════════════════════════════════════════════════════
//  PENDING ACTIONS LISTENER (DM)
// ══════════════════════════════════════════════════════════
function listenPendingActions() {
  if (!activeSessionId) return;
  unsubActions = db.collection('ActiveCombat').doc(activeSessionId)
    .collection('combatActions')
    .where('status','in',['pending','awaitingDamage'])
    .onSnapshot(snap => {
      pendingActions = {};
      snap.forEach(d => { pendingActions[d.id] = {id:d.id,...d.data()}; });
      renderPendingPanel();
    });
}

// ══════════════════════════════════════════════════════════
//  RENDER CARDS
// ══════════════════════════════════════════════════════════
function hpPct(c,mx) { return mx?Math.max(0,Math.min(100,Math.round((c/mx)*100))):0; }
function hpBg(p) { return p>75?'#3d7018':p>50?'#8a9220':p>25?'#9a5e12':p>0?'#8b1010':'#1a0808'; }
function sbClass(pct) {
  if (pct>75) return 'fine'; if (pct>50) return 'injured';
  if (pct>25) return 'bloodied'; if (pct>0) return 'critical';
  return 'unconscious';
}

function renderCards() {
  const sorted = Object.values(combatants).sort((a,b)=>(b.initiative||0)-(a.initiative||0));
  const enemies = sorted.filter(c=>c.type==='enemy');
  const party   = sorted.filter(c=>c.type==='player');

  document.getElementById('hostile-count').textContent = enemies.length;
  document.getElementById('party-count').textContent = party.length;

  document.getElementById('hostile-cards').innerHTML = enemies.map(c=>enemyCard(c)).join('');
  document.getElementById('party-cards').innerHTML = party.map(c=>partyCard(c)).join('');
}

function enemyCard(c) {
  const pct = hpPct(c.currentHp, c.maxHp);
  const [slabel, scls] = statusLabel(pct);
  const deadCls = (c.isDead||c.currentHp<=0&&pct===0) ? ' dead' : '';
  const conds = (c.conditions||[]).join(', ');
  const showHp = isDM(); // DM sees numbers, players see label only
  const hpHtml = showHp
    ? `<div class="cc-hp-row"><span class="cc-hp-num">${c.currentHp}</span><span class="cc-hp-max">/${c.maxHp}${c.tempHp?' (+'+c.tempHp+' tmp)':''}</span></div>`
    : '';
  const dmBtns = isDM() ? `
    <div style="display:flex;gap:.3rem;margin-top:.35rem;flex-wrap:wrap;">
      <button class="enc-btn enc-btn-green enc-btn-sm" onclick="event.stopPropagation();quickHeal('${c.id}',5)">+5</button>
      <button class="enc-btn enc-btn-danger enc-btn-sm" onclick="event.stopPropagation();quickDmg('${c.id}',5)">-5</button>
      <button class="enc-btn enc-btn-ghost enc-btn-sm" onclick="event.stopPropagation();removeEnemy('${c.id}')">&#x2715;</button>
    </div>` : '';
  const clickable = !c.isDead && !isDM() ? `onclick="openActionModal('${c.id}')"` : isDM() ? `onclick="openDmAdjustModal('${c.id}')"` : '';
  return `<div class="cc enemy${deadCls}" ${clickable}>
    <div class="cc-name">${esc(c.name)}</div>
    <div class="cc-sub">Init ${c.initiative||0}${showHp&&c.armorClass?' · AC '+c.armorClass:''}</div>
    ${hpHtml}
    <div class="cc-bar-t"><div class="cc-bar-f" style="width:${pct}%;background:${hpBg(pct)};"></div></div>
    <div style="margin-top:.22rem;"><span class="status-badge sb-${sbClass(pct)}">${slabel}</span></div>
    ${conds?`<div class="cc-conds">&#9883; ${esc(conds)}</div>`:''}
    ${dmBtns}
  </div>`;
}

function partyCard(c) {
  const pct = hpPct(c.currentHp, c.maxHp);
  const conds = (c.conditions||[]).join(', ');
  // Everyone sees exact HP for party
  return `<div class="cc player${c.isDead?' dead':''}" onclick="${isDM()?'openDmAdjustModal(\''+c.id+'\')':'openAllyModal(\''+c.id+'\')'}">
    <div class="cc-name">${esc(c.name)}</div>
    <div class="cc-sub">${esc(c.characterClass||'')}${c.level?' Lv'+c.level:''}</div>
    <div class="cc-hp-row">
      <span class="cc-hp-num">${c.currentHp}</span>
      <span class="cc-hp-max">/${c.maxHp}${c.tempHp?' (+'+c.tempHp+')':''}</span>
    </div>
    <div class="cc-bar-t"><div class="cc-bar-f" style="width:${pct}%;background:${hpBg(pct)};"></div></div>
    ${conds?`<div class="cc-conds">&#9883; ${esc(conds)}</div>`:''}
  </div>`;
}

// ══════════════════════════════════════════════════════════
//  ENCOUNTER SHEET (LEFT PANEL)
// ══════════════════════════════════════════════════════════
function updateSheetNav() {
  const prev = document.getElementById('btn-prev-sheet');
  const next = document.getElementById('btn-next-sheet');
  const lbl  = document.getElementById('enc-sheet-label');
  if (!isDM() || !partyChars.length) {
    if (prev) prev.disabled=true; if (next) next.disabled=true;
    return;
  }
  sheetNavIdx = Math.max(0, Math.min(sheetNavIdx, partyChars.length-1));
  if (prev) prev.disabled = (sheetNavIdx === 0);
  if (next) next.disabled = (sheetNavIdx === partyChars.length-1);
  const c = partyChars[sheetNavIdx];
  if (lbl && c) lbl.textContent = c.characterName || 'Character Sheet';
  renderEncSheet();
}

function navSheet(dir) {
  sheetNavIdx = Math.max(0, Math.min(sheetNavIdx+dir, partyChars.length-1));
  updateSheetNav();
}

function renderEncSheet() {
  const root = document.getElementById('enc-sheet-root');
  let char = isDM() ? partyChars[sheetNavIdx] : myChar;
  if (!char) {
    root.innerHTML = '<div class="no-session-msg">No character loaded.</div>';
    return;
  }
  const s   = char.sheet || {};
  const sc  = s.abilityScores || {str:10,dex:10,con:10,int:10,wis:10,cha:10};
  const lv  = char.level || 1;
  const pb  = PROF_BY_LV[Math.min(20,Math.max(1,lv))];
  const saves  = s.savingThrowProficiencies || [];
  const skillP = s.skillProficiencies || [];
  const skillE = s.skillExpertises || [];
  const maxHp  = s.maxHp || (HIT_DIE[char.class]||8);
  const curHp  = s.hp ?? maxHp;
  const tempHp = s.tempHp || 0;
  const pct    = hpPct(curHp, maxHp);
  function m(x){return Math.floor(((x||10)-10)/2);}
  function ms(x){const v=m(x);return(v>=0?'+':'')+v;}
  let ac=10+m(sc.dex||10);
  if(char.class==='Barbarian')ac=10+m(sc.dex)+m(sc.con||10);
  if(char.class==='Monk')ac=10+m(sc.dex)+m(sc.wis||10);

  const abHtml = SKEYS.map(k=>`<div class="ab-mini-cell">
    <div class="ab-mini-nm">${SABRV[k]}</div>
    <div class="ab-mini-mod">${ms(sc[k]||10)}</div>
    <div class="ab-mini-sc">${sc[k]||10}</div>
  </div>`).join('');

  const skillsHtml = ALL_SKILLS.map(sk=>{
    const ab=SKILL_AB[sk];const exp=skillE.includes(sk);const prf=skillP.includes(sk)||exp;
    const v=m(sc[ab]||10)+(exp?pb*2:prf?pb:0);
    return `<div class="skill-mini">
      <div class="sc-pip${exp?' e':prf?' f':''}"></div>
      <span class="sval">${v>=0?'+':''}${v}</span>
      <span>${sk}</span>
    </div>`;
  }).join('');

  const savesHtml = SKEYS.map(k=>{
    const prof=saves.includes(k);const v=m(sc[k]||10)+(prof?pb:0);
    return `<div class="skill-mini">
      <div class="sc-pip${prof?' f':''}"></div>
      <span class="sval">${v>=0?'+':''}${v}</span>
      <span>${SNAMES[k]} Save</span>
    </div>`;
  }).join('');

  const ds = s.deathSaves||{};
  const pperc = 10+m(sc.wis||10)+(skillP.includes('Perception')?pb:0)+(skillE.includes('Perception')?pb:0);

  root.innerHTML = `
    <div class="cs-name">${esc(char.characterName||'Unknown')}</div>
    <div class="cs-meta">
      <div><span>Class / Level</span>${esc(char.class||'—')} Lv${lv}</div>
      <div><span>Species</span>${esc(char.race||'—')}</div>
      <div><span>Gold</span>${char.gold||0} gp</div>
      <div><span>XP</span>${char.xp||0}</div>
    </div>

    <div class="cs-sec-title">Ability Scores</div>
    <div class="ab-mini">${abHtml}</div>

    <div class="combat-mini">
      <div class="cm-box"><div class="cm-v">${ac}</div><div class="cm-l">AC</div></div>
      <div class="cm-box"><div class="cm-v">${ms(sc.dex||10)}</div><div class="cm-l">Initiative</div></div>
      <div class="cm-box"><div class="cm-v">+${pb}</div><div class="cm-l">Prof Bonus</div></div>
    </div>

    <div class="hp-panel">
      <div class="hp-panel-row">
        <div><div class="hp-n" id="enc-hp-cur">${curHp}</div><div class="hp-l">Current HP</div></div>
        <div><div class="hp-n">${maxHp}</div><div class="hp-l">Max HP</div></div>
        <div><div class="hp-n" style="font-size:1.1rem;color:var(--text-m);">${tempHp||0}</div><div class="hp-l">Temp</div></div>
      </div>
      <div class="hp-bar-t"><div class="hp-bar-f" id="enc-hp-bar" style="width:${pct}%;background:${hpBg(pct)};"></div></div>
      ${isDM()?`<div style="margin-top:.5rem;display:flex;gap:.3rem;">
        <button class="enc-btn enc-btn-green enc-btn-sm" onclick="adjustMyHp('heal')">+ Heal</button>
        <button class="enc-btn enc-btn-danger enc-btn-sm" onclick="adjustMyHp('dmg')">&#8722; Dmg</button>
        <input class="ae-input" id="enc-hp-adj" type="number" min="1" max="999" value="5" style="width:55px;">
      </div>`:`<div style="margin-top:.4rem;font-size:.72rem;color:var(--text-d);font-style:italic;">Your DM adjusts HP during the session.</div>`}
    </div>

    <div class="cs-grid-2" style="margin-bottom:.5rem;">
      <div>
        <div class="cs-sec-title">Saving Throws</div>
        ${savesHtml}
      </div>
      <div>
        <div class="cs-sec-title">Key Skills</div>
        ${skillsHtml.split('</div>').slice(0,9).join('</div>')}
        <div style="font-size:.7rem;color:var(--text-d);font-style:italic;margin-top:.2rem;">Passive Perc: ${pperc}</div>
      </div>
    </div>

    <div class="cs-sec-title">Death Saving Throws</div>
    <div style="display:flex;flex-direction:column;gap:.2rem;margin-bottom:.6rem;">
      <div class="skill-mini"><span style="min-width:65px;color:var(--text-d);">Successes</span>${[0,1,2].map(i=>`<div class="sc-pip${(ds.successes||0)>i?' f':''}"></div>`).join('')}</div>
      <div class="skill-mini"><span style="min-width:65px;color:var(--text-d);">Failures</span>${[0,1,2].map(i=>`<div class="sc-pip${(ds.failures||0)>i?' e':''}"></div>`).join('')}</div>
    </div>

    ${s.originFeat?`<div style="font-size:.78rem;color:var(--text-m);margin-bottom:.3rem;"><span style="font-family:'Cinzel',serif;font-size:.6rem;color:var(--text-d);">Feat:</span> ${esc(s.originFeat)}</div>`:''}
    ${char.background?`<div style="font-size:.78rem;color:var(--text-m);"><span style="font-family:'Cinzel',serif;font-size:.6rem;color:var(--text-d);">Background:</span> ${esc(char.background)}</div>`:''}
  `;
}

// HP adjustments for DM on party sheets
async function adjustMyHp(action) {
  const c = partyChars[sheetNavIdx];
  if (!c || !activeSessionId) return;
  const amt = parseInt(document.getElementById('enc-hp-adj').value)||0;
  if (!amt) return;
  const combId = Object.values(combatants).find(x=>x.characterId===c.id)?.id;
  if (!combId) return;
  await applyHpToCombatant(combId, action, amt);
}

// ══════════════════════════════════════════════════════════
//  NOTES
// ══════════════════════════════════════════════════════════
function renderNotes() {
  const area = document.getElementById('notes-display');
  if (!sessionData) return;
  const notes  = sessionData.encounterNotes || '';
  const imgUrl = sessionData.encounterImageUrl || '';
  if (!notes && !imgUrl) { area.innerHTML='<div class="enc-notes-empty">No notes posted yet.</div>'; return; }
  area.innerHTML = `
    ${imgUrl?`<img src="${esc(imgUrl)}" class="enc-notes-img" alt="Encounter image" onerror="this.style.display='none';">`:''}
    ${notes?`<div class="enc-notes-text">${esc(notes)}</div>`:''}`;
}

function toggleNotesEdit() {
  const form = document.getElementById('notes-form');
  const vis  = form.style.display === 'none';
  form.style.display = vis ? 'block' : 'none';
  if (vis && sessionData) {
    document.getElementById('notes-text').value = sessionData.encounterNotes||'';
    document.getElementById('notes-img-url').value = sessionData.encounterImageUrl||'';
  }
}

async function saveNotes() {
  if (!activeSessionId) return;
  const notes  = document.getElementById('notes-text').value;
  const imgUrl = document.getElementById('notes-img-url').value.trim();
  try {
    await db.collection('ActiveCombat').doc(activeSessionId)
      .update({ encounterNotes: notes, encounterImageUrl: imgUrl });
    toggleNotesEdit(); toast('Notes saved.','success');
  } catch(e) { toast('Failed to save notes.','error'); }
}

// ══════════════════════════════════════════════════════════
//  SESSION SETUP (DM)
// ══════════════════════════════════════════════════════════
async function loadPartyPicker() {
  const picker = document.getElementById('party-picker');
  if (!picker) return;
  picker.innerHTML = '<div style="font-style:italic;color:var(--text-d);font-size:.8rem;grid-column:1/-1;">Loading...</div>';
  try {
    const snap = await db.collection('Characters').where('status','==','Active').get();
    const chars = snap.docs.map(d=>({id:d.id,...d.data()}));
    picker.innerHTML = chars.map(c=>`<label class="picker-label">
      <input type="checkbox" value="${c.id}"
        data-maxhp="${(c.sheet&&c.sheet.maxHp)||HIT_DIE[c.class]||8}"
        data-name="${esc(c.characterName)}" data-player="${esc(c.playerId)}"
        data-class="${esc(c.class||'')}" data-level="${c.level||1}"
        data-ac="${(c.sheet&&c.sheet.abilityScores)?String(10+Math.floor(((c.sheet.abilityScores.dex||10)-10)/2)):'10'}">
      ${esc(c.characterName)} <span style="color:var(--text-d);font-size:.72rem;">(${esc(c.class||'')} Lv${c.level||1} – ${esc(c.playerId)})</span>
    </label>`).join('');
  } catch(e) { picker.innerHTML='<div style="color:var(--text-d);font-style:italic;grid-column:1/-1;">Failed to load characters.</div>'; }
}

async function startSession() {
  const name = document.getElementById('ss-name').value.trim() || 'Encounter';
  const checked = [...document.querySelectorAll('#party-picker input:checked')];
  if (!checked.length) { toast('Select at least one party member.','error'); return; }
  try {
    const sessionRef = db.collection('ActiveCombat').doc();
    const batch = db.batch();
    batch.set(sessionRef,{ sessionName:name, dmId:loggedUser, isActive:true, createdAt:new Date().toISOString(), encounterNotes:'', encounterImageUrl:'' });
    checked.forEach(cb => {
      const ref = sessionRef.collection('combatants').doc(cb.value);
      const maxHp = parseInt(cb.dataset.maxhp)||8;
      batch.set(ref,{
        name:cb.dataset.name, type:'player', characterId:cb.value,
        playerId:cb.dataset.player, characterClass:cb.dataset.class,
        level:parseInt(cb.dataset.level)||1, maxHp, currentHp:maxHp, tempHp:0,
        armorClass:parseInt(cb.dataset.ac)||10, initiative:0, conditions:[], isDead:false
      });
    });
    await batch.commit();
    toast(`"${name}" started!`,'success');
  } catch(e) { console.error(e); toast('Failed to start session.','error'); }
}

async function addEnemy() {
  if (!activeSessionId) return;
  const name = document.getElementById('e-name').value.trim();
  const maxHp = parseInt(document.getElementById('e-hp').value)||10;
  const ac    = parseInt(document.getElementById('e-ac').value)||12;
  const init  = parseInt(document.getElementById('e-init').value)||0;
  if (!name) { toast('Enter an enemy name.','error'); return; }
  try {
    await db.collection('ActiveCombat').doc(activeSessionId)
      .collection('combatants').add({
        name, type:'enemy', maxHp, currentHp:maxHp, tempHp:0,
        armorClass:ac, initiative:init, conditions:[], isDead:false
      });
    document.getElementById('e-name').value='';
    toast(`${name} added.`,'success');
  } catch(e) { toast('Failed.','error'); }
}

async function removeEnemy(id) {
  if (!confirm('Remove this enemy?')) return;
  try {
    await db.collection('ActiveCombat').doc(activeSessionId).collection('combatants').doc(id).delete();
  } catch(e) { toast('Failed.','error'); }
}

async function endSession() {
  if (!activeSessionId||!confirm('End this encounter?')) return;
  try {
    const snap = await db.collection('ActiveCombat').doc(activeSessionId).collection('combatants').get();
    const batch = db.batch();
    snap.docs.forEach(d=>batch.delete(d.ref));
    batch.update(db.collection('ActiveCombat').doc(activeSessionId),{isActive:false,endedAt:new Date().toISOString()});
    await batch.commit();
    toast('Session ended.','info');
  } catch(e) { toast('Failed.','error'); }
}

// ══════════════════════════════════════════════════════════
//  QUICK HP ADJUST (DM direct)
// ══════════════════════════════════════════════════════════
async function quickHeal(combId, amt) { await applyHpToCombatant(combId,'heal',amt); }
async function quickDmg(combId, amt)  { await applyHpToCombatant(combId,'dmg',amt);  }

async function applyHpToCombatant(combId, action, amt) {
  const c = combatants[combId]; if(!c||!activeSessionId) return;
  let hp=c.currentHp, tmp=c.tempHp||0;
  if(action==='heal') hp=Math.min(c.maxHp,hp+amt);
  if(action==='dmg'){if(tmp>0){const ab=Math.min(tmp,amt);tmp-=ab;hp=Math.max(0,hp-(amt-ab));}else hp=Math.max(0,hp-amt);}
  if(action==='temp') tmp+=amt;
  try {
    await db.collection('ActiveCombat').doc(activeSessionId).collection('combatants').doc(combId)
      .update({currentHp:hp, tempHp:tmp});
    // If player character, also sync to Characters collection
    if (c.characterId) {
      await db.collection('Characters').doc(c.characterId).update({'sheet.hp':hp,'sheet.tempHp':tmp});
    }
  } catch(e) { toast('HP update failed.','error'); }
}

// ══════════════════════════════════════════════════════════
//  DM ADJUST MODAL
// ══════════════════════════════════════════════════════════
let dmAdjTarget = null;
function openDmAdjustModal(combId) {
  dmAdjTarget = combId;
  const c = combatants[combId]; if(!c) return;
  const body = document.getElementById('m-action-body');
  document.getElementById('m-action-title').textContent = 'Adjust: ' + (c.name||'?');
  body.innerHTML = `
    <div class="mc-info-box">
      <b>${esc(c.name)}</b> — ${c.currentHp}/${c.maxHp} HP${c.armorClass?' · AC '+c.armorClass:''}
    </div>
    <input class="mc-input" id="dm-adj-amt" type="number" min="1" max="999" value="5">
    <div class="mc-btn-row">
      <button class="mc-btn mc-btn-green" onclick="dmApplyAdj('heal')">+ Heal</button>
      <button class="mc-btn mc-btn-red"   onclick="dmApplyAdj('dmg')">&#8722; Damage</button>
      <button class="mc-btn mc-btn-gold"  onclick="dmApplyAdj('temp')">+ Temp</button>
    </div>
    ${c.type==='enemy'?`<div class="mc-btn-row" style="margin-top:.4rem;">
      <button class="mc-btn" style="background:rgba(155,21,21,.1);border-color:var(--red-d);color:var(--red);" onclick="dmToggleDead('${combId}',${!!c.isDead})">
        ${c.isDead?'Revive':'Mark Dead'}
      </button>
    </div>`:''}
    <div class="mc-btn-row" style="margin-top:.4rem;">
      <button class="mc-btn mc-btn-ghost" onclick="closeActionModal()">Close</button>
    </div>`;
  document.getElementById('m-action').classList.add('open');
}

async function dmApplyAdj(action) {
  const amt = parseInt(document.getElementById('dm-adj-amt').value)||0;
  if (!amt||!dmAdjTarget) return;
  await applyHpToCombatant(dmAdjTarget, action, amt);
  closeActionModal();
}

async function dmToggleDead(id, wasDead) {
  try {
    await db.collection('ActiveCombat').doc(activeSessionId).collection('combatants').doc(id)
      .update({isDead:!wasDead, currentHp:wasDead?1:0});
    closeActionModal();
  } catch(e) { toast('Failed.','error'); }
}

// ══════════════════════════════════════════════════════════
//  PLAYER ACTION MODAL (multi-step)
// ══════════════════════════════════════════════════════════
let actionTarget = null; // combatant being attacked
let actionStep = null;   // 'choose'|'attackRoll'|'savingThrow'|'selectStat'|'damage'|'waiting'
let actionData = {};

function openActionModal(combId) {
  if (!activeSessionId || !myChar) { toast('No active session or character.','error'); return; }
  actionTarget = combatants[combId]; if(!actionTarget) return;
  actionStep = 'choose'; actionData = {};
  document.getElementById('m-action-title').textContent = 'Action: ' + esc(actionTarget.name);
  renderActionStep();
  document.getElementById('m-action').classList.add('open');
}

function openAllyModal(combId) {
  const c = combatants[combId]; if(!c) return;
  const body = document.getElementById('m-action-body');
  document.getElementById('m-action-title').textContent = esc(c.name);
  const pct = hpPct(c.currentHp, c.maxHp);
  const [sl, scls] = statusLabel(pct);
  body.innerHTML = `
    <div class="mc-info-box">
      <b>${esc(c.name)}</b> — ${esc(c.characterClass||'')} Lv${c.level||1}<br>
      HP: <b>${c.currentHp}/${c.maxHp}</b>${c.tempHp?' (+'+c.tempHp+' temp)':''}<br>
      Status: <span class="status-badge sb-${sbClass(pct)}">${sl}</span>
      ${(c.conditions||[]).length?'<br>Conditions: '+esc(c.conditions.join(', ')):''}
    </div>
    <div class="mc-btn-row"><button class="mc-btn mc-btn-ghost" onclick="closeActionModal()">Close</button></div>`;
  document.getElementById('m-action').classList.add('open');
}

function renderActionStep() {
  const body = document.getElementById('m-action-body');
  const c = actionTarget;
  if (actionStep === 'choose') {
    body.innerHTML = `
      <div class="mc-info-box">Target: <b>${esc(c.name)}</b>${c.armorClass?' — AC '+c.armorClass:' — AC unknown'}</div>
      <div class="mc-btn-row">
        <button class="mc-btn mc-btn-red" onclick="actionChoose('attack')">&#9876; Attack</button>
        <button class="mc-btn mc-btn-ghost" onclick="closeActionModal()">Cancel</button>
      </div>`;
  } else if (actionStep === 'attack') {
    body.innerHTML = `
      <div class="mc-info-box">Choose your attack type:</div>
      <div class="mc-btn-row">
        <button class="mc-btn mc-btn-gold" onclick="actionChoose('attackRoll')">Attack Roll</button>
        <button class="mc-btn mc-btn-gold" onclick="actionChoose('savingThrow')">Saving Throw</button>
      </div>
      <div class="mc-info-box" style="margin-top:.7rem;font-size:.76rem;">
        <b>Attack Roll:</b> Roll d20 + ability mod + proficiency (if proficient).<br>
        <b>Saving Throw:</b> You set the DC; the enemy rolls — enter the DC and damage if they fail.
      </div>
      <div class="mc-btn-row"><button class="mc-btn mc-btn-ghost" onclick="actionStep='choose';renderActionStep()">&#8592; Back</button></div>`;
  } else if (actionStep === 'attackRoll') {
    const ac = c.armorClass || '??';
    body.innerHTML = `
      <div class="mc-info-box">Target AC: <b>${ac}</b><br>Enter your total attack roll (d20 + mods):</div>
      <input class="mc-input" id="roll-val" type="number" min="1" max="30" placeholder="e.g. 17">
      <div class="mc-info-box" style="font-size:.74rem;">
        <b>How to calculate:</b> d20 roll + ability modifier (STR for weapons, DEX for finesse/ranged, casting stat for spells) + proficiency bonus if proficient with the weapon.
      </div>
      <div class="mc-btn-row">
        <button class="mc-btn mc-btn-red" onclick="submitAttackRoll()">Submit Roll</button>
        <button class="mc-btn mc-btn-ghost" onclick="actionStep='attack';renderActionStep()">&#8592; Back</button>
      </div>`;
  } else if (actionStep === 'savingThrow') {
    body.innerHTML = `
      <div class="mc-info-box">Select the saving throw stat and enter the DC:</div>
      <div class="mc-stat-grid" id="stat-pick">
        ${SKEYS.map(k=>`<div class="stat-btn" onclick="selectStat('${k}')">${SABRV[k]}</div>`).join('')}
      </div>
      <input class="mc-input" id="dc-val" type="number" min="1" max="30" placeholder="DC (e.g. 14)">
      <div class="mc-btn-row">
        <button class="mc-btn mc-btn-red" onclick="submitSavingThrow()">Submit</button>
        <button class="mc-btn mc-btn-ghost" onclick="actionStep='attack';renderActionStep()">&#8592; Back</button>
      </div>`;
  } else if (actionStep === 'waiting') {
    body.innerHTML = `
      <div class="mc-waiting">
        <div class="spinner-sm"></div> Awaiting DM confirmation…<br>
        <span style="font-size:.76rem;color:var(--text-d);">Your DM will confirm or deny this action.</span>
      </div>
      <div class="mc-btn-row"><button class="mc-btn mc-btn-ghost" onclick="cancelMyAction()">Cancel</button></div>`;
  } else if (actionStep === 'damage') {
    body.innerHTML = `
      <div class="mc-info-box" style="color:var(--green-b);">&#10003; Hit confirmed! Enter your damage roll:</div>
      <input class="mc-input" id="dmg-val" type="number" min="1" max="200" placeholder="e.g. 8">
      <div class="mc-info-box" style="font-size:.74rem;">Roll your weapon/spell damage dice and enter the total. DM will confirm before HP is deducted.</div>
      <div class="mc-btn-row"><button class="mc-btn mc-btn-red" onclick="submitDamage()">Submit Damage</button></div>`;
  } else if (actionStep === 'waitingDamage') {
    body.innerHTML = `<div class="mc-waiting"><div class="spinner-sm"></div> Awaiting DM damage confirmation…</div>`;
  } else if (actionStep === 'done') {
    body.innerHTML = `
      <div class="mc-info-box" style="color:var(--green-b);">&#10003; ${esc(actionData.summary||'Action resolved.')}</div>
      <div class="mc-btn-row"><button class="mc-btn mc-btn-ghost" onclick="closeActionModal()">Close</button></div>`;
  }
}

function actionChoose(type) { actionStep = type; renderActionStep(); }
function selectStat(stat) {
  actionData.saveStat = stat;
  document.querySelectorAll('#stat-pick .stat-btn').forEach(b=>b.classList.remove('selected'));
  document.querySelector(`#stat-pick .stat-btn[onclick="selectStat('${stat}')"]`)?.classList.add('selected');
}

async function submitAttackRoll() {
  const roll = parseInt(document.getElementById('roll-val').value);
  if (!roll) { toast('Enter your roll total.','error'); return; }
  actionData = { rollType:'attackRoll', rollValue:roll };
  await writeAction();
}

async function submitSavingThrow() {
  if (!actionData.saveStat) { toast('Select a saving throw stat.','error'); return; }
  const dc = parseInt(document.getElementById('dc-val').value);
  if (!dc) { toast('Enter a DC value.','error'); return; }
  actionData.rollType = 'savingThrow'; actionData.dc = dc;
  await writeAction();
}

async function writeAction() {
  if (!activeSessionId || !myChar) return;
  try {
    const ref = await db.collection('ActiveCombat').doc(activeSessionId)
      .collection('combatActions').add({
        attackerPlayerId: loggedUser,
        attackerName: loggedName || loggedUser,
        attackerCharName: myChar.characterName || '',
        targetCombatantId: actionTarget.id,
        targetName: actionTarget.name,
        actionType: 'attack',
        rollType: actionData.rollType,
        rollValue: actionData.rollValue || null,
        dc: actionData.dc || null,
        saveStat: actionData.saveStat || null,
        status: 'pending',
        submittedAt: new Date().toISOString(),
      });
    myPendingActionId = ref.id;
    actionStep = 'waiting';
    renderActionStep();
    listenMyAction(ref.id);
  } catch(e) { console.error(e); toast('Failed to submit action.','error'); }
}

function listenMyAction(actionId) {
  if (unsubMyAction) { unsubMyAction(); unsubMyAction=null; }
  unsubMyAction = db.collection('ActiveCombat').doc(activeSessionId)
    .collection('combatActions').doc(actionId)
    .onSnapshot(snap => {
      if (!snap.exists) return;
      const a = snap.data();
      if (a.status === 'hit') {
        actionStep = 'damage'; renderActionStep();
      } else if (a.status === 'miss') {
        actionStep = 'done'; actionData.summary = 'Miss — the attack did not connect.';
        renderActionStep();
        if (unsubMyAction) { unsubMyAction(); unsubMyAction=null; }
      } else if (a.status === 'awaitingDamage') {
        actionStep = 'waitingDamage'; renderActionStep();
      } else if (a.status === 'complete') {
        actionStep = 'done';
        actionData.summary = `${a.finalDamage} damage dealt to ${esc(actionTarget.name)}!`;
        renderActionStep();
        if (unsubMyAction) { unsubMyAction(); unsubMyAction=null; }
      }
    });
}

async function submitDamage() {
  const dmg = parseInt(document.getElementById('dmg-val').value);
  if (!dmg) { toast('Enter damage amount.','error'); return; }
  try {
    await db.collection('ActiveCombat').doc(activeSessionId)
      .collection('combatActions').doc(myPendingActionId)
      .update({ damageValue: dmg, status: 'awaitingDamage' });
    actionStep = 'waitingDamage'; renderActionStep();
  } catch(e) { toast('Failed.','error'); }
}

async function cancelMyAction() {
  if (!myPendingActionId) { closeActionModal(); return; }
  try {
    await db.collection('ActiveCombat').doc(activeSessionId)
      .collection('combatActions').doc(myPendingActionId)
      .update({status:'cancelled'});
    myPendingActionId=null;
    if(unsubMyAction){unsubMyAction();unsubMyAction=null;}
    closeActionModal();
  } catch(e) { closeActionModal(); }
}

function closeActionModal() { document.getElementById('m-action').classList.remove('open'); }

// ══════════════════════════════════════════════════════════
//  PENDING ACTIONS PANEL (DM)
// ══════════════════════════════════════════════════════════
function renderPendingPanel() {
  const panel = document.getElementById('pending-panel');
  const body  = document.getElementById('pending-body');
  const badge = document.getElementById('pending-badge');
  const items = Object.values(pendingActions).filter(a=>a.status==='pending'||a.status==='awaitingDamage');
  badge.textContent = items.length || '';
  if (!items.length) { panel.style.display='none'; return; }
  panel.style.display = 'flex';
  body.innerHTML = items.map(a => {
    const c = combatants[a.targetCombatantId];
    const ac = c?.armorClass;
    if (a.status === 'pending') {
      // Attack roll pending
      if (a.rollType === 'attackRoll') {
        const hit = ac ? (a.rollValue >= ac) : null;
        const hitLabel = ac ? (hit ? `HITS (AC ${ac})` : `MISSES (AC ${ac})`) : `Roll: ${a.rollValue} — AC unknown`;
        return `<div class="pp-action">
          <div class="pp-action-title">&#9876; ${esc(a.attackerCharName||a.attackerName)} attacks ${esc(a.targetName)}</div>
          <div class="pp-action-detail">Attack Roll: <b>${a.rollValue}</b> — ${hitLabel}</div>
          ${ac?'':'<div style="margin:.3rem 0;"><input class="pp-override-input" id="ac-inp-'+a.id+'" type="number" min="1" max="30" placeholder="AC" style="width:50px;"> <span style="font-size:.72rem;color:var(--text-d);">Enter enemy AC</span></div>'}
          <div class="pp-btn-row">
            <button class="pp-btn pp-btn-confirm" onclick="dmConfirmHit('${a.id}',true)">&#10003; Hit</button>
            <button class="pp-btn pp-btn-deny" onclick="dmConfirmHit('${a.id}',false)">&#10007; Miss</button>
          </div>
        </div>`;
      } else {
        // Saving throw
        return `<div class="pp-action">
          <div class="pp-action-title">&#9876; ${esc(a.attackerCharName||a.attackerName)} saving throw vs ${esc(a.targetName)}</div>
          <div class="pp-action-detail">Stat: <b>${SABRV[a.saveStat]||a.saveStat}</b> — DC: <b>${a.dc}</b></div>
          <div class="pp-btn-row">
            <button class="pp-btn pp-btn-confirm" onclick="dmConfirmHit('${a.id}',true)">Failed Save → Damage</button>
            <button class="pp-btn pp-btn-deny" onclick="dmConfirmHit('${a.id}',false)">Passed Save</button>
          </div>
        </div>`;
      }
    } else if (a.status === 'awaitingDamage') {
      return `<div class="pp-action">
        <div class="pp-action-title">&#9760; ${esc(a.attackerCharName||a.attackerName)} → ${esc(a.targetName)}: ${a.damageValue} damage</div>
        <div class="pp-action-detail">Confirm damage to apply to target's HP:</div>
        <div style="display:flex;align-items:center;gap:.4rem;margin:.3rem 0;">
          <input class="pp-override-input" id="override-${a.id}" type="number" min="0" max="999" value="${a.damageValue}" placeholder="Dmg">
          <span style="font-size:.72rem;color:var(--text-d);">Override if needed</span>
        </div>
        <div class="pp-btn-row">
          <button class="pp-btn pp-btn-confirm" onclick="dmConfirmDamage('${a.id}','${a.targetCombatantId}')">&#10003; Apply</button>
          <button class="pp-btn pp-btn-deny" onclick="dmDenyAction('${a.id}')">Cancel</button>
        </div>
      </div>`;
    }
    return '';
  }).join('');
}

async function dmConfirmHit(actionId, isHit) {
  const acInp = document.getElementById('ac-inp-'+actionId);
  const ac = acInp ? parseInt(acInp.value)||null : null;
  const update = {status: isHit?'hit':'miss'};
  if (ac) update.targetAC = ac;
  // Also update the combatant's AC if provided
  const a = pendingActions[actionId];
  if (a && ac && a.targetCombatantId && combatants[a.targetCombatantId]) {
    await db.collection('ActiveCombat').doc(activeSessionId).collection('combatants').doc(a.targetCombatantId).update({armorClass:ac});
  }
  await db.collection('ActiveCombat').doc(activeSessionId).collection('combatActions').doc(actionId).update(update);
}

async function dmConfirmDamage(actionId, combatantId) {
  const overrideEl = document.getElementById('override-'+actionId);
  const finalDmg = overrideEl ? (parseInt(overrideEl.value)||0) : (pendingActions[actionId]?.damageValue||0);
  try {
    await db.collection('ActiveCombat').doc(activeSessionId).collection('combatActions').doc(actionId)
      .update({status:'complete', finalDamage:finalDmg});
    await applyHpToCombatant(combatantId,'dmg',finalDmg);
    toast(`${finalDmg} damage applied.`,'success');
  } catch(e) { toast('Failed to confirm damage.','error'); }
}

async function dmDenyAction(actionId) {
  await db.collection('ActiveCombat').doc(activeSessionId).collection('combatActions').doc(actionId).update({status:'cancelled'});
}

// ══════════════════════════════════════════════════════════
//  UTILS
// ══════════════════════════════════════════════════════════
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function toast(msg,type='info'){const w=document.getElementById('toasts'),el=document.createElement('div');el.className=`toast ${type}`;el.textContent=msg;w.appendChild(el);setTimeout(()=>el.remove(),4500);}

boot();
</script>
