<style>

:root{--bg:#100c08;--bg-card:#1a1410;--border:rgba(180,110,40,.22);--gold:#c8952a;--gold-d:#7a5818;--red:#c41e1e;--text:#e0d8c8;--text-m:#a89880;--text-d:#6a5840;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);background-image:radial-gradient(ellipse 90% 55% at 50% 0%,#1e1208,transparent 65%);min-height:100vh;font-family:'Crimson Pro',Georgia,serif;color:var(--text);overflow-x:hidden;}


/* ── PURCHASE OVERLAY ── */
#shop-overlay{display:none;position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.82);backdrop-filter:blur(4px);align-items:flex-end;justify-content:center;}
#shop-overlay.open{display:flex;}
.shop-panel{background:#1a1410;border:1px solid rgba(180,110,40,.35);border-bottom:none;border-radius:8px 8px 0 0;width:100%;max-width:920px;height:82vh;display:flex;flex-direction:column;box-shadow:0 -8px 48px rgba(0,0,0,.7);animation:panel-up .28s ease;}
@keyframes panel-up{from{transform:translateY(100%);}to{transform:none;}}
.sp-header{display:flex;align-items:center;justify-content:space-between;padding:.7rem 1.4rem;border-bottom:1px solid rgba(180,110,40,.2);flex-shrink:0;}
.sp-title{font-family:'Cinzel',serif;font-size:.9rem;font-weight:700;color:#e0d8c8;}
.sp-close{background:transparent;border:1px solid rgba(180,110,40,.3);border-radius:3px;color:#a89880;font-family:'Cinzel',serif;font-size:.72rem;padding:.25rem .7rem;cursor:pointer;transition:all .18s;}
.sp-close:hover{border-color:#c41e1e;color:#c41e1e;}
.sp-filter-row{display:flex;gap:.3rem;padding:.5rem 1.2rem;border-bottom:1px solid rgba(180,110,40,.15);flex-shrink:0;flex-wrap:wrap;}
.sp-tab{font-family:'Cinzel',serif;font-size:.6rem;font-weight:600;letter-spacing:.07em;padding:.26rem .65rem;border-radius:3px;border:1px solid rgba(180,110,40,.2);background:transparent;color:#a89880;cursor:pointer;transition:all .18s;}
.sp-tab:hover,.sp-tab.active{background:rgba(180,110,40,.18);border-color:rgba(180,110,40,.5);color:#c8952a;}
.sp-body{flex:1;overflow-y:auto;padding:.9rem 1.2rem;}
.sp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:.75rem;}
.sp-item{background:#201a14;border:1px solid rgba(180,110,40,.18);border-radius:4px;padding:.75rem .95rem;display:flex;flex-direction:column;gap:.32rem;transition:border-color .18s;}
.sp-item:hover{border-color:rgba(180,110,40,.38);}
.sp-item-name{font-family:'Cinzel',serif;font-size:.76rem;font-weight:700;color:#e0d8c8;}
.sp-item-cat{font-family:'Cinzel',serif;font-size:.5rem;letter-spacing:.1em;text-transform:uppercase;color:#6a5840;}
.sp-item-desc{font-size:.78rem;color:#a89880;line-height:1.58;flex:1;}
.sp-item-foot{display:flex;align-items:center;justify-content:space-between;margin-top:.28rem;}
.sp-price{font-family:'Cinzel',serif;font-size:.8rem;font-weight:700;color:#c8952a;}
.sp-buy{font-family:'Cinzel',serif;font-size:.58rem;font-weight:600;letter-spacing:.07em;padding:.26rem .65rem;border-radius:3px;border:1px solid rgba(180,110,40,.42);background:rgba(180,110,40,.12);color:#c8952a;cursor:pointer;transition:all .18s;}
.sp-buy:hover:not(:disabled){background:rgba(180,110,40,.26);}
.sp-buy:disabled{opacity:.38;cursor:default;}
.sp-gold-bar{display:flex;align-items:center;gap:.5rem;font-family:'Cinzel',serif;font-size:.66rem;color:#a89880;padding:.4rem 1.2rem;border-top:1px solid rgba(180,110,40,.12);flex-shrink:0;}
.sp-gold-val{color:#c8952a;font-weight:700;}
.sp-empty{text-align:center;padding:2.5rem;color:#6a5840;font-style:italic;font-size:.85rem;}
.open-shop-btn{position:fixed;bottom:1.5rem;right:1.5rem;z-index:300;font-family:'Cinzel',serif;font-size:.8rem;font-weight:700;letter-spacing:.12em;padding:.75rem 1.7rem;border-radius:4px;cursor:pointer;background:rgba(200,149,42,.35);border:2px solid #c8952a;color:#f0e8d8;transition:all .22s;box-shadow:0 4px 24px rgba(200,149,42,.35),0 0 0 1px rgba(200,149,42,.15);}
.open-shop-btn:hover{background:rgba(200,149,42,.52);border-color:#e0b040;color:#fff;box-shadow:0 6px 32px rgba(200,149,42,.5),0 0 0 1px rgba(200,149,42,.3);}

/* ── SHOP ATMOSPHERE ── */
.shop-hero{
  min-height:100vh;
  background:
    radial-gradient(ellipse 60% 50% at 20% 30%,rgba(90,55,15,.35),transparent 55%),
    radial-gradient(ellipse 50% 50% at 80% 70%,rgba(60,35,10,.4),transparent 55%),
    linear-gradient(180deg,#120a04,#0e0804);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:5rem 2rem;position:relative;overflow:hidden;
}
.shop-hero::before{
  content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(
    0deg,transparent,transparent 38px,rgba(180,110,40,.025) 38px,rgba(180,110,40,.025) 39px
  ),repeating-linear-gradient(
    90deg,transparent,transparent 38px,rgba(180,110,40,.025) 38px,rgba(180,110,40,.025) 39px
  );
  pointer-events:none;
}
.shop-sign{
  text-align:center;position:relative;z-index:1;max-width:600px;
}
.shop-sign-plank{
  background:linear-gradient(135deg,#2a1a08,#1e1204);
  border:3px solid rgba(180,110,40,.45);
  border-radius:4px;padding:3rem 4rem;
  box-shadow:0 8px 40px rgba(0,0,0,.6),inset 0 0 60px rgba(180,110,40,.04);
  position:relative;
}
.shop-sign-plank::before{
  content:'';position:absolute;inset:8px;border:1px solid rgba(180,110,40,.1);border-radius:2px;pointer-events:none;
}
.shop-sign-ornament{font-size:.6rem;letter-spacing:.65em;color:rgba(200,149,42,.5);font-family:'Cinzel',serif;margin-bottom:.8rem;}
.shop-sign-title{font-family:'Cinzel',serif;font-size:clamp(1.8rem,5vw,3.2rem);font-weight:900;color:#e0d8c8;line-height:1.1;margin-bottom:.5rem;}
.shop-sign-title span{color:#c8952a;}
.shop-sign-sub{font-style:italic;color:#8a6838;font-size:1rem;margin-bottom:2rem;}
.shop-divider{display:flex;align-items:center;gap:.8rem;margin:0 auto 2rem;max-width:280px;}
.shop-divider-line{flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(180,110,40,.5),transparent);}
.shop-divider-gem{color:rgba(180,110,40,.6);font-size:.7rem;}
.shop-hours{
  display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;
  font-family:'Cinzel',serif;font-size:.62rem;letter-spacing:.08em;color:#6a5030;
}
.shop-hours-badge{background:rgba(180,110,40,.08);border:1px solid rgba(180,110,40,.2);border-radius:3px;padding:.22rem .65rem;}
@keyframes flicker{0%,100%{opacity:1;}45%{opacity:.9;}55%{opacity:.85;}}
.shop-lantern{
  font-size:3rem;display:block;margin-bottom:1rem;
  animation:flicker 3.5s ease-in-out infinite;
  filter:drop-shadow(0 0 12px rgba(200,140,30,.4));
}
</style>

<script>

let spFilter = 'All';
let spActiveChar = null;

async function loadShopData() {
  // Load active character from sessionStorage
  const keys = ['dnd_username','admin_username','session_dm_username','dm_username'];
  const username = keys.map(k=>sessionStorage.getItem(k)).find(Boolean);
  if (!username) return;
  try {
    const snap = await db.collection('Characters').where('playerId','==',username).where('status','==','Active').get();
    if (!snap.empty) {
      spActiveChar = {id:snap.docs[0].id,...snap.docs[0].data()};
      document.getElementById('sp-charname').textContent = spActiveChar.characterName || username;
      document.getElementById('sp-gold').textContent = (spActiveChar.gold??0) + ' gp';
    }
  } catch(e) { console.error(e); }
}

function openShop() {
  document.getElementById('shop-overlay').classList.add('open');
  loadShopData();
  renderShopItems(spFilter);
}

function closeShop() {
  document.getElementById('shop-overlay').classList.remove('open');
}

function filterShop(cat, btn) {
  spFilter = cat;
  document.querySelectorAll('.sp-tab').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  renderShopItems(cat);
}

function renderShopItems(cat) {
  const grid = document.getElementById('sp-grid');
  const items = cat === 'All' ? SHOP_ITEMS : SHOP_ITEMS.filter(i=>i.cat===cat);
  if (!items.length) { grid.innerHTML='<div class="sp-empty">No items in this category.</div>'; return; }
  const gold = spActiveChar ? (spActiveChar.gold??0) : 0;
  grid.innerHTML = items.map((item,i)=>`
    <div class="sp-item">
      <div class="sp-item-name">${esc(item.name)}</div>
      <div class="sp-item-cat">${esc(item.cat)}</div>
      <div class="sp-item-desc">${esc(item.desc)}</div>
      <div class="sp-item-foot">
        <span class="sp-price">${item.price} gp</span>
        <button class="sp-buy" ${!spActiveChar||gold<item.price?'disabled':''} onclick="buyItem(${i})">Buy</button>
      </div>
    </div>`).join('');
}

async function buyItem(idx) {
  const item = spFilter === 'All' ? SHOP_ITEMS[idx] : SHOP_ITEMS.filter(i=>i.cat===spFilter)[idx];
  if (!item || !spActiveChar) return;
  const gold = spActiveChar.gold ?? 0;
  if (gold < item.price) { spToast('Not enough gold.','error'); return; }
  if (!confirm(`Buy ${item.name} for ${item.price} gp?`)) return;
  try {
    const newGold = gold - item.price;
    await db.collection('Characters').doc(spActiveChar.id).update({gold: newGold});
    await db.collection('Inventory').add({
      characterId: spActiveChar.id,
      itemName: item.name,
      quantity: 1,
      source: 'Adventurers Outfitters',
      acquiredDate: new Date().toISOString(),
      pricePaid: item.price,
    });
    spActiveChar.gold = newGold;
    document.getElementById('sp-gold').textContent = newGold + ' gp';
    renderShopItems(spFilter);
    spToast(`${item.name} purchased!`,'success');
  } catch(e) { console.error(e); spToast('Purchase failed.','error'); }
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function spToast(msg,type){
  const w=document.getElementById('sp-toasts');
  const el=document.createElement('div');
  el.style.cssText='background:#1a1410;border:1px solid;border-radius:4px;padding:.5rem 1rem;font-family:Cinzel,serif;font-size:.75rem;margin-bottom:.3rem;animation:tin .22s ease;white-space:nowrap;';
  el.style.borderColor=type==='success'?'#3d7018':'#8b1010';
  el.style.color=type==='success'?'#80c060':'#e06060';
  el.textContent=msg;w.appendChild(el);setTimeout(()=>el.remove(),4000);
}

</script>
